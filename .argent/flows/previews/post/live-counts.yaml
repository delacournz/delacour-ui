executionPrerequisite: >-
  The chrome-free preview route is open on post/live-counts and has settled — Like at 999, Repost at 42 and
  Save, all unlit. The capture script navigates there before running this.
steps:
  - echo: Lighting each stat, so every count rolls up
  - tap: { id: post-like }
  - wait: 500
  - tap: { id: post-repost }
  - wait: 500
  - tap: { id: post-save }
  - wait: 900
  - echo: And clearing them, so the counts roll back down and the clip loops
  - tap: { id: post-like }
  - wait: 500
  - tap: { id: post-repost }
  - wait: 500
  - tap: { id: post-save }
