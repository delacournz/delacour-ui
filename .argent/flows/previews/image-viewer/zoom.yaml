executionPrerequisite: >-
  The chrome-free preview route is open on image-viewer/zoom, captured as the whole screen, and has settled — one
  landscape thumbnail centred on screen, the viewer closed. The capture script navigates there before running this.
steps:
  - await: { visible: { id: image-viewer-trigger-map } }
  - echo: Opening the photo
  - tap: { id: image-viewer-trigger-map }
  - await: { visible: { id: image-viewer-close } }
  - wait: 900
  # A raw gesture-custom rather than a directive: no directive double-taps. The point is the
  # screen's centre, where the fitted image always rests, offset a little so the zoom has a
  # visible focal point.
  - echo: Double-tapping zooms in about the tapped point
  - tool: gesture-custom
    args:
      events:
        - { type: Down, x: 0.62, y: 0.46 }
        - { type: Up, x: 0.62, y: 0.46, delayMs: 60 }
        - { type: Down, x: 0.62, y: 0.46, delayMs: 90 }
        - { type: Up, x: 0.62, y: 0.46, delayMs: 60 }
  - wait: 1200
  - echo: And again to zoom back out, so the chrome returns
  - tool: gesture-custom
    args:
      events:
        - { type: Down, x: 0.5, y: 0.5 }
        - { type: Up, x: 0.5, y: 0.5, delayMs: 60 }
        - { type: Down, x: 0.5, y: 0.5, delayMs: 90 }
        - { type: Up, x: 0.5, y: 0.5, delayMs: 60 }
  - await: { visible: { id: image-viewer-close } }
  - wait: 700
  - tap: { id: image-viewer-close }
  - await: { hidden: { id: image-viewer-counter } }
