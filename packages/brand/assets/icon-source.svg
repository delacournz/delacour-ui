<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
	<!--
		Delacour app-icon master art. The house palette: #18181B card, #FBBF24
		stroke. Sharp miter joins, unrounded corners, unbroken crossings.

		Full-bleed square by design — iOS applies its own mask and Android takes
		the glyph into its adaptive safe zone, so nothing here is pre-rounded and
		nothing carries a drop shadow. The docs site rounds its own copies.

		Two 262.4px squares rotated 45° about cy 428.5 / 595.5, stroke 66.4,
		miter joins. They overlap opaquely.

		This file is the authored source. `src/geometry.ts` restates every number
		below as a constant, `src/geometry.test.ts` pins the two together, and
		every consumer draws from the constants: apps/playground's launcher PNGs
		and react-native-svg components, apps/web's favicon set and inline mark.
		Edit this file and the constants together, or the test fails.
	-->
	<rect width="1024" height="1024" fill="#18181B"/>
	<g fill="none" stroke="#FBBF24" stroke-width="66.4" stroke-linejoin="miter" stroke-miterlimit="10">
		<rect x="380.8" y="297.3" width="262.4" height="262.4" transform="rotate(45 512 428.5)"/>
		<rect x="380.8" y="464.3" width="262.4" height="262.4" transform="rotate(45 512 595.5)"/>
	</g>
</svg>
