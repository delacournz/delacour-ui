name: release:prod

defaults:
  tools:
    bun: 1.3.9

on:
  push:
    branches:
      - release/playground/*
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
        description: "Version to build, x.y.z. Defaults to the release/playground/x.y.z branch name."

jobs:
  # `${{ inputs.version }}` and `${{ github.ref_name }}` render as the literal
  # string "undefined" when their context is absent — a push event carries no
  # `inputs`, and `eas workflow:run` carries no ref. `[ -n "$VAR" ]` reads those
  # four letters as a value, which is what failed the first real triggered run.
  # Both are normalised with a `case` before anything tests them.
  #
  # `case` rather than `[ … ] && VERSION=""`: the step runs under
  # `/bin/bash -eo pipefail`, where a bare test-and-assign whose test is false
  # makes the list return non-zero.
  extract_version:
    name: Extract Version
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        name: Parse version
        run: |
          VERSION="${{ inputs.version }}"
          case "$VERSION" in undefined|null) VERSION="" ;; esac
          if [ -z "$VERSION" ]; then
            REF_NAME="${{ github.ref_name }}"
            case "$REF_NAME" in
              release/playground/*) VERSION="${REF_NAME##release/playground/}" ;;
            esac
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid version format: '$VERSION' (expected x.y.z)"
            echo "Pass one explicitly with -F version=x.y.z, or push to release/playground/x.y.z."
            exit 1
          fi
          echo "Version: $VERSION"
          set-output version "$VERSION"

  # Fingerprint the build
  fingerprint:
    name: Fingerprint
    type: fingerprint
    needs: [extract_version]

  # Check for existing Android build
  get_android_build:
    name: Check for existing android build
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production

  # Check for existing iOS build
  get_ios_build:
    name: Check for existing ios build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production

  # If no existing Android build, build it
  build_android:
    name: Build Android
    needs: [get_android_build, extract_version]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    env:
      APP_VERSION: ${{ needs.extract_version.outputs.version }}
    params:
      platform: android
      profile: production

  # If no existing iOS build, build it
  build_ios:
    name: Build iOS
    needs: [get_ios_build, extract_version]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    env:
      APP_VERSION: ${{ needs.extract_version.outputs.version }}
    params:
      platform: ios
      profile: production

  # Waits for Android build to finish then submits it
  submit_android_build:
    name: Submit Android Build
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}

  # Waits for iOS build to finish then submits it
  submit_ios_build:
    name: Submit iOS Build
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}

  # If there is an existing Android build, we want to create an OTA update for it.
  publish_android_update:
    name: Publish Android update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: android

  # If there is an existing iOS build, we want to create an OTA update for it.
  publish_ios_update:
    name: Publish iOS update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: ios

