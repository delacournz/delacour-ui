executionPrerequisite: >-
  The chrome-free preview route is open on attachment/upload-states and has settled — floor-plan.pdf at rest, site-visit.mp4
  on a looping bar, elevation.png in error with retry, and the Upload button. The capture script navigates there before running this.
steps:
  - echo: Uploading floor-plan.pdf until the bar fills and it settles
  - tap: { id: attachment-upload-start }
  - wait: 3600
  - echo: Retrying the failed image clears its error
  - tap: { id: attachment-upload-error-retry }
  - wait: 900
  - echo: Removing it puts the error back, so the clip loops without a jump cut
  - tap: { id: attachment-upload-error-remove }
  - wait: 900
