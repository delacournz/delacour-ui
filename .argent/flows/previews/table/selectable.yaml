executionPrerequisite: >-
  The chrome-free preview route is open on table/selectable and has settled — four invoices,
  INV-042 selected and INV-043 disabled. The capture script navigates there before running this.
steps:
  - echo: Selecting the last row, then the first
  - tap: { id: table-selectable-INV-044 }
  - wait: 600
  - tap: { id: table-selectable-INV-041 }
  - wait: 600
  - echo: The disabled row ignores the press
  - tap: { id: table-selectable-INV-043 }
  - wait: 600
  - echo: And back to INV-042, so the clip loops without a jump cut
  - tap: { id: table-selectable-INV-042 }
