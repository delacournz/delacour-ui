executionPrerequisite: >-
  The chrome-free preview route is open on markdown-editor/custom-toolbar and has settled — an empty four-row editor with
  a four-action toolbar, the field unfocused. The capture script navigates there before running this.
steps:
  - echo: Starting a bulleted list from the toolbar, then letting Return continue it
  - tap: { id: custom-toolbar }
  - wait: 500
  - tap: { id: markdown-action-bulletList }
  - wait: 600
  - tool: keyboard
    args: { text: "Milk", delayMs: 70 }
  - tool: keyboard
    args: { key: enter }
  - wait: 200
  - tool: keyboard
    args: { text: "Eggs", delayMs: 70 }
  - wait: 800
  - echo: Deleting all thirteen characters and blurring, so the clip ends empty and unfocused as it began
  - tool: keyboard
    args: { key: backspace }
  - tool: keyboard
    args: { key: backspace }
  - tool: keyboard
    args: { key: backspace }
  - tool: keyboard
    args: { key: backspace }
  - tool: keyboard
    args: { key: backspace }
  - tool: keyboard
    args: { key: backspace }
  - tool: keyboard
    args: { key: backspace }
  - tool: keyboard
    args: { key: backspace }
  - tool: keyboard
    args: { key: backspace }
  - tool: keyboard
    args: { key: backspace }
  - tool: keyboard
    args: { key: backspace }
  - tool: keyboard
    args: { key: backspace }
  - tool: keyboard
    args: { key: backspace }
  - wait: 200
  - tap: { id: preview-dismiss-keyboard }
  - wait: 500
