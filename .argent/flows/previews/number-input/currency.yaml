executionPrerequisite: >-
  The chrome-free preview route is open on number-input/currency and has settled — a price of
  $1,249.50 stepping by 0.50. The capture script navigates there before running this.
steps:
  - echo: Stepping the price up twice
  - tap: { id: currency-increment }
  - wait: 400
  - tap: { id: currency-increment }
  - wait: 700
  - echo: And back down twice, so the clip loops at $1,249.50
  - tap: { id: currency-decrement }
  - wait: 400
  - tap: { id: currency-decrement }
