name: build:native:prod

defaults:
  tools:
    bun: 1.3.9

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
        description: "Version to build, x.y.z. Defaults to the release/playground/x.y.z branch name."

jobs:
  # This workflow is manual only — a push to `release/playground/x.y.z` triggers
  # `release:prod` instead, and two workflows on one branch double-build. So the
  # version comes from `-F version=x.y.z`; `eas workflow:run` carries no ref for
  # the branch fallback below to read.
  #
  # `${{ inputs.version }}` and `${{ github.ref_name }}` render as the literal
  # string "undefined" when their context is absent — a push event carries no
  # `inputs`, and `eas workflow:run` carries no ref. `[ -n "$VAR" ]` reads those
  # four letters as a value, which is what failed the first real triggered run.
  # Both are normalised with a `case` before anything tests them.
  #
  # `case` rather than `[ … ] && VERSION=""`: the step runs under
  # `/bin/bash -eo pipefail`, where a bare test-and-assign whose test is false
  # makes the list return non-zero.
  extract_version:
    name: Extract Version
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        name: Parse version
        run: |
          VERSION="${{ inputs.version }}"
          case "$VERSION" in undefined|null) VERSION="" ;; esac
          if [ -z "$VERSION" ]; then
            REF_NAME="${{ github.ref_name }}"
            case "$REF_NAME" in
              release/playground/*) VERSION="${REF_NAME##release/playground/}" ;;
            esac
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid version format: '$VERSION' (expected x.y.z)"
            echo "Pass one explicitly with -F version=x.y.z, or push to release/playground/x.y.z."
            exit 1
          fi
          echo "Version: $VERSION"
          set-output version "$VERSION"

  # Generate fingerprint
  fingerprint:
    name: Generate Fingerprint
    type: fingerprint
    needs: [extract_version]

  # Build Android
  build_android:
    name: Build Android
    type: build
    needs: [fingerprint, extract_version]
    env:
      APP_VERSION: ${{ needs.extract_version.outputs.version }}
    params:
      platform: android
      profile: production

  # Build iOS
  build_ios:
    name: Build iOS
    type: build
    needs: [fingerprint, extract_version]
    env:
      APP_VERSION: ${{ needs.extract_version.outputs.version }}
    params:
      platform: ios
      profile: production

  # Submit Android Build
  submit_android_build:
    name: Submit Android Build
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}

  # Submit iOS Build
  submit_ios_build:
    name: Submit iOS Build
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
