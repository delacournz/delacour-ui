executionPrerequisite: >-
  The chrome-free preview route is open on scroll-header/cover and has settled — a photo cover behind the "Ridge walk"
  title, the list of stops below it. The capture script navigates there before running this.
steps:
  - echo: Pulling down past the top — the cover stretches from its top edge, then springs back
  - swipe: { from: { id: scroll-header-cover }, by: { y: 0.15 }, momentum: false, duration: 900 }
  - wait: 700
  - echo: Scrolling up — the cover leaves with the content and the bar takes over
  - swipe: { from: { id: scroll-header-cover }, by: { y: -0.3 }, momentum: false, duration: 1200 }
  - wait: 700
  - echo: And back to rest, so the clip loops
  - swipe: { from: { id: scroll-header-cover }, by: { y: 0.35 }, momentum: false, duration: 1200 }
  - wait: 700
