executionPrerequisite: >-
  The chrome-free preview route is open on pagination/compact and has settled — the readout on 3 / 12 between the
  arrows. The capture script navigates there before running this.
steps:
  - echo: Two pages on
  - tap: { text: Next page, within: { id: pagination-compact } }
  - wait: 450
  - tap: { text: Next page, within: { id: pagination-compact } }
  - wait: 700
  - echo: And two back, so the clip loops on 3 / 12
  - tap: { text: Previous page, within: { id: pagination-compact } }
  - wait: 450
  - tap: { text: Previous page, within: { id: pagination-compact } }
