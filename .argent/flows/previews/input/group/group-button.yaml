executionPrerequisite: >-
  The chrome-free preview route is open on input/group/group-button and has settled — an empty search field with no
  clear button, a coupon field and a disabled one. The capture script navigates there before running this.
steps:
  - echo: Typing a search, which brings the group's clear button in
  - tap: { id: group-button-search }
  - wait: 300
  - tool: keyboard
    args: { text: tabs, delayMs: 120 }
  - wait: 800
  - echo: Clearing it with the group button, and submitting so the field blurs as it began
  - tap: { id: group-button-clear }
  - wait: 400
  - tool: keyboard
    args: { key: enter }
  - wait: 500
