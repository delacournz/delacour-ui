executionPrerequisite: >-
  The chrome-free preview route is open on text-animation/rolling and has settled — 1,248 with a "Next reading" button
  under it. The capture script navigates there before running this.
steps:
  - echo: Stepping through all four readings, so the last tap rolls back to the first and the clip loops
  - tap: { id: text-animation-rolling-next }
  - wait: 1000
  - tap: { id: text-animation-rolling-next }
  - wait: 1000
  - tap: { id: text-animation-rolling-next }
  - wait: 1000
  - tap: { id: text-animation-rolling-next }
  - wait: 900
