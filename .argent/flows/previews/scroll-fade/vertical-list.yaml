executionPrerequisite: >-
  The chrome-free preview route is open on scroll-fade/vertical-list and has settled — a card of ten rows scrolled to the
  top, only the bottom edge faded. The capture script navigates there before running this.
steps:
  - wait: 500
  - echo: Scrolling down a little — the top edge fades in
  # momentum:false so the list stops where the finger does rather than being flung past it.
  - swipe: { from: { id: scroll-fade-vertical }, by: { y: -0.08 }, momentum: false, duration: 600 }
  - wait: 600
  - echo: On to the end — the bottom edge clears
  - swipe: { from: { id: scroll-fade-vertical }, by: { y: -0.25 }, momentum: false, duration: 900 }
  - wait: 800
  - echo: And back to the top, so the clip loops without a jump cut
  - swipe: { from: { id: scroll-fade-vertical }, by: { y: 0.35 }, momentum: false, duration: 1100 }
  - wait: 500
