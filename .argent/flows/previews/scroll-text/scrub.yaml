executionPrerequisite: >-
  The chrome-free preview route is open on scroll-text/scrub and has settled — a ScrollText at 30% progress above a
  Slider at 30, its thumb carrying the testID scroll-text-scrub. The capture script navigates there before running
  this.
steps:
  - echo: Dragging the thumb resolves the text word by word
  # momentum:false so the thumb stops where the finger does, and the same distance back so the clip loops.
  - swipe: { from: { id: scroll-text-scrub }, by: { x: 0.5 }, momentum: false, duration: 1400 }
  - wait: 500
  - echo: And back down by the same distance, dimming it again
  - swipe: { from: { id: scroll-text-scrub }, by: { x: -0.5 }, momentum: false, duration: 1400 }
