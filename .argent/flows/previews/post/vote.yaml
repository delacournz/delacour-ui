executionPrerequisite: >-
  The chrome-free preview route is open on post/vote and has settled — no vote cast, the score pill at 1.2K and
  untinted. The capture script navigates there before running this.
steps:
  - echo: Upvoting, then switching to a downvote
  - tap: { id: post-vote-up }
  - wait: 800
  - tap: { id: post-vote-down }
  - wait: 800
  - echo: Tapping the cast arrow again clears it, so the clip loops without a jump cut
  - tap: { id: post-vote-down }
