  - wait: 400
  - echo: The first seam moves only the files and the editor
  - swipe: { from: { id: handle-0 }, by: { x: 0.12 }, momentum: false, duration: 600 }
  - wait: 400
  - swipe: { from: { id: handle-0 }, by: { x: -0.12 }, momentum: false, duration: 600 }
