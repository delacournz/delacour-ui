executionPrerequisite: >-
  The chrome-free preview route is open on tag-input/basic and has settled — one box holding three chips (design,
  mobile, typescript) and an empty, unfocused field. The capture script navigates there before running this.
steps:
  - echo: Typing a topic and committing it with a comma
  - tap: { id: tag-input-basic-input }
  - wait: 300
  - tool: keyboard
    args: { text: "expo,", delayMs: 120 }
  - wait: 900
  - echo: Backspace arms the new chip, a second removes it
  - tool: keyboard
    args: { key: backspace }
  - wait: 800
  - tool: keyboard
    args: { key: backspace }
  - wait: 600
  - echo: Return on the empty field blurs it, so the clip loops unfocused as it began
  - tool: keyboard
    args: { key: enter }
  - wait: 300
