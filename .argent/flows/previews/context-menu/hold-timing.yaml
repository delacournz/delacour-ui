executionPrerequisite: >-
  The chrome-free preview route is open on context-menu/hold-timing and has settled — the Quick, Default and
  Deliberate rows with no menu open. The capture script navigates there before running this.
steps:
  - echo: The quick row opens after 150ms
  - long-press: { on: { id: context-menu-hold-150 }, duration: 350 }
  - await: { visible: { id: context-menu-hold-150-pin } }
  - wait: 800
  # A coordinate rather than the scrim's label: the scrim fills the screen, so a
  # tap on its centre lands on the panel and chooses a row. Near the top the
  # scrim is the only thing there, and the await below fails the flow if not.
  - tool: gesture-tap
    args: { x: 0.5, y: 0.12 }
  - await: { hidden: { id: context-menu-hold-150-pin } }
  - wait: 300
  - echo: The deliberate row has to be held for 800ms
  - long-press: { on: { id: context-menu-hold-800 }, duration: 1050 }
  - await: { visible: { id: context-menu-hold-800-pin } }
  - wait: 800
  # A coordinate rather than the scrim's label: the scrim fills the screen, so a
  # tap on its centre lands on the panel and chooses a row. Near the top the
  # scrim is the only thing there, and the await below fails the flow if not.
  - tool: gesture-tap
    args: { x: 0.5, y: 0.12 }
  - await: { hidden: { id: context-menu-hold-800-pin } }
