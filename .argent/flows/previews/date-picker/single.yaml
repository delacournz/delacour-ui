executionPrerequisite: >-
  The chrome-free preview route is open on date-picker/single and has settled — the trigger reads
  14 October 2026 and the sheet is closed. The capture script navigates there before running this.
steps:
  - echo: Opening the sheet and picking the 21st — it closes on its own
  - tap: { id: date-picker-single-trigger }
  - await: { visible: { id: date-picker-single-calendar-day-2026-10-21 } }
  - wait: 600
  - tap: { id: date-picker-single-calendar-day-2026-10-21 }
  - await: { hidden: { id: date-picker-single-calendar } }
  - wait: 900
  - echo: Back to the 14th, so the clip loops
  - tap: { id: date-picker-single-trigger }
  - await: { visible: { id: date-picker-single-calendar-day-2026-10-14 } }
  - wait: 500
  - tap: { id: date-picker-single-calendar-day-2026-10-14 }
  - await: { hidden: { id: date-picker-single-calendar } }
  - wait: 500
