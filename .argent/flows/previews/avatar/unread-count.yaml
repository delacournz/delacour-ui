executionPrerequisite: >-
  The chrome-free preview route is open on avatar/unread-count and has
  settled — Rawiri Kemp with a red 3 badge. The capture script navigates there
  before running this.
steps:
  - echo: Marking read clears the badge, then three new messages bring it back
  - tap: { id: unread-clear }
  - wait: 800
  - tap: { id: unread-add }
  - wait: 350
  - tap: { id: unread-add }
  - wait: 350
  - tap: { id: unread-add }
