executionPrerequisite: >-
  The chrome-free preview route is open on number-input/bounds and has settled — guests at the minimum
  of 1 of 4, the minus dimmed. The capture script navigates there before running this.
steps:
  - echo: Stepping up to the maximum, where the plus dims
  - tap: { id: bounds-increment }
  - wait: 350
  - tap: { id: bounds-increment }
  - wait: 350
  - tap: { id: bounds-increment }
  - wait: 800
  - echo: And back down to the minimum, so the clip loops without a jump cut
  - tap: { id: bounds-decrement }
  - wait: 350
  - tap: { id: bounds-decrement }
  - wait: 350
  - tap: { id: bounds-decrement }
