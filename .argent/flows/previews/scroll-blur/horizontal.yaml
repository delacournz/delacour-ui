executionPrerequisite: >-
  The chrome-free preview route is open on scroll-blur/horizontal and has settled — a row of coloured cards at its
  start, only the right edge blurred. The capture script navigates there before running this.
steps:
  - echo: Dragging the row left — the left band arrives as cards pass it
  - swipe: { from: { id: scroll-blur-row }, by: { x: -0.4 }, momentum: false, duration: 1000 }
  - wait: 600
  - echo: And back to the start, so the clip loops without a jump cut
  - swipe: { from: { id: scroll-blur-row }, by: { x: 0.45 }, momentum: false, duration: 1000 }
  - wait: 600
