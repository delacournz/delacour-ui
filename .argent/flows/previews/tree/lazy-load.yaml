executionPrerequisite: >-
  The chrome-free preview route is open on tree/lazy-load and has settled — Northland open with its two cities, the
  other three regions closed and unloaded. The capture script navigates there before running this.
steps:
  - echo: Closing Northland and opening Auckland, which fetches its cities behind a spinner
  - tap: { id: lazy-Northland }
  - wait: 400
  - tap: { id: lazy-Auckland }
  - wait: 1600
  - echo: Swapping back to Northland, so the clip loops without a jump cut
  - tap: { id: lazy-Auckland }
  - wait: 400
  - tap: { id: lazy-Northland }
  - wait: 500
