executionPrerequisite: >-
  The chrome-free preview route is open on feedback/sending and has settled — the Report a problem button with the
  dialog closed and the failure switch off. The capture script navigates there before running this.
steps:
  - echo: Failing the next send, then opening the dialog
  - tap: { id: feedback-sending-fail }
  - wait: 400
  - tap: { id: feedback-sending-open }
  - await: { visible: { id: feedback-sending-field } }
  - wait: 600
  - tap: { id: feedback-sending-field }
  - wait: 800
  - tool: keyboard
    args: { text: "Checkout froze on the last step", delayMs: 70 }
  - wait: 600
  - echo: Send spins and the field is read-only; the failure keeps the draft
  - tap: { id: feedback-sending-send }
  - await: { visible: { id: feedback-sending-error } }
  - wait: 1500
