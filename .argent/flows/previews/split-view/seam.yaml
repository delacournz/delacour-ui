executionPrerequisite: >-
  The chrome-free preview route is open on split-view/seam and has settled — a card
  holding two flush panes at the middle stop, the drag row carrying the testID
  drag-area.
steps:
  - echo: The chart shrinks to its smallest stop, then comes back
  - swipe: { from: { id: drag-area }, by: { y: -0.12 }, momentum: false, duration: 600 }
  - wait: 500
  - swipe: { from: { id: drag-area }, by: { y: 0.12 }, momentum: false, duration: 600 }
  - wait: 500
  - echo: Then grows to fill the card, and comes back
  - swipe: { from: { id: drag-area }, by: { y: 0.13 }, momentum: false, duration: 600 }
  - wait: 500
  - swipe: { from: { id: drag-area }, by: { y: -0.13 }, momentum: false, duration: 600 }
  - wait: 500
