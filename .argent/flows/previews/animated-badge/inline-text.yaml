executionPrerequisite: >-
  The chrome-free preview route is open on animated-badge/inline-text and has settled — a sentence holding an
  "8 reviews" badge, with a "More reviews" button below. The capture script navigates there before running this.
steps:
  - echo: Growing the count so the badge widens and the sentence reflows around it
  - tap: { id: more-reviews }
  - wait: 800
  - tap: { id: more-reviews }
  - wait: 800
  - tap: { id: more-reviews }
  - wait: 1000
  - echo: A fourth press wraps back to 8, so the clip loops without a jump cut
  - tap: { id: more-reviews }
  - wait: 800
