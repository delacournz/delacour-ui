executionPrerequisite: >-
  The chrome-free preview route is open on color-picker/basic and has settled — the area with its
  thumb in the top-right corner (#ffa100), the hue track on orange, and the hex field. The capture
  script navigates there before running this.
steps:
  - echo: Dragging the area's thumb down and left, into the muted shades
  # Just inside the corner, not on the thumb: the thumb is centred on the corner,
  # so its centre sits on the area's edge and a touch there misses the pan.
  # momentum:false so the thumb stops where the finger does; the return
  # overshoots the corner, which clamps, so the clip ends where it began.
  - swipe: { from: { x: 0.93, y: 0.315 }, by: { x: -0.33, y: 0.108 }, momentum: false, duration: 800 }
  - wait: 400
  - echo: Sliding the hue round to blue and back
  - swipe: { from: { id: color-picker-basic-hue-thumb }, by: { x: 0.4 }, momentum: false, duration: 800 }
  - wait: 400
  # The returns start from coordinates: a thumb moves by transform, so its id
  # still resolves to where it sat before the drag.
  - swipe: { from: { x: 0.568, y: 0.571 }, by: { x: -0.4 }, momentum: false, duration: 800 }
  - wait: 300
  - echo: And the area thumb back to its corner, so the clip loops without a jump cut
  - swipe: { from: { x: 0.6, y: 0.423 }, by: { x: 0.38, y: -0.16 }, momentum: false, duration: 800 }
  - wait: 400
