executionPrerequisite: >-
  The chrome-free preview route is open on switch/start-and-end-content and has settled — three switches with text either side, all on. The
  capture script navigates there before running this.
steps:
  - echo: Switching each size off, largest first
  - tap: { id: switch-lg }
  - wait: 400
  - tap: { id: switch-md }
  - wait: 400
  - tap: { id: switch-sm }
  - wait: 700
  - echo: And back on, so the clip loops without a jump cut
  - tap: { id: switch-sm }
  - wait: 400
  - tap: { id: switch-md }
  - wait: 400
  - tap: { id: switch-lg }
