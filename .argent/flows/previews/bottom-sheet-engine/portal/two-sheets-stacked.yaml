executionPrerequisite: >-
  The chrome-free preview route is open on bottom-sheet-engine/portal/two-sheets-stacked and has settled — the trigger button with every
  sheet closed. The capture script navigates there before running this.
steps:
  - echo: Opening the first sheet
  - tap: { id: stack-open-first }
  - await: { visible: { id: stack-open-second } }
  - wait: 700
  - echo: Opening the second from inside it — it stacks on top
  - tap: { id: stack-open-second }
  - await: { visible: { id: stack-dismiss-all } }
  - wait: 1000
  - echo: Dismissing both at once through the registry
  - tap: { id: stack-dismiss-all }
  - await: { hidden: { id: stack-open-second } }
