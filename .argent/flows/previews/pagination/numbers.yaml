executionPrerequisite: >-
  The chrome-free preview route is open on pagination/numbers and has settled — the numbers run on page 7 of 24,
  drawn 1 … 7 … 24 between the arrows. The capture script navigates there before running this.
steps:
  - echo: One page on and back with the arrows
  - tap: { text: Next page, within: { id: pagination-numbers } }
  - wait: 500
  - tap: { text: Previous page, within: { id: pagination-numbers } }
  - wait: 600
  - echo: Five pages forward through the trailing gap, then back through the leading one
  - tap: { text: Jump forward 5 pages, within: { id: pagination-numbers } }
  - wait: 700
  - tap: { text: Jump back 5 pages, within: { id: pagination-numbers } }
