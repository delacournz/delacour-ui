executionPrerequisite: >-
  The chrome-free preview route is open on pagination/simple and has settled — page 2 of 8, both labelled arrows
  enabled. The capture script navigates there before running this.
steps:
  - echo: Back to the first page — Previous fades out, disabled at its end
  - tap: { text: Previous page, within: { id: pagination-simple } }
  - wait: 1100
  - echo: And on again, so the clip loops on page 2 with both arrows live
  - tap: { text: Next page, within: { id: pagination-simple } }
