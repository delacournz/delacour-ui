name: CI

# NOT THE MERGE GATE FOR ORDINARY PULL REQUESTS. `bun run signoff` runs these checks on the machine
# that authored the change — where they had already run once — and writes the `signoff/*` commit
# statuses `.github/rulesets/develop.json` requires. See AGENTS.md § Signoff. The path gate for the
# registry check lives in scripts/signoff-checks.ts, the single copy both halves read.
#
# What still runs here, and why:
#
# - The version pull request (`changeset-release/develop`). No person authors it — `version.yml`
#   force-pushes it with the release app's token on every merge — so nobody is at a laptop to sign it
#   off. Every job is gated to that head branch on `pull_request`, and the `signoff` job writes the
#   same statuses `bun run signoff` would, for the head SHA it tested. It is also the one run that
#   includes `verify-expo` before a release reaches npm.
# - `workflow_dispatch`, the escape hatch for a check a laptop cannot run. The `mode` dropdown picks
#   `report` (run only) or `signoff` (a green run writes the statuses itself). `pr` and `signoff-sha`
#   are both optional and pick the commit: a PR number tests that PR's head, a SHA tests that commit,
#   both pins the PR to that exact head, neither tests the tip of the dispatched ref. The `resolve`
#   job turns that into one SHA, and every job checks that SHA out — the workflow file is always the
#   dispatched ref's, the tree tested is the target's.
# - A push to `release/playground/*`, which triggers the EAS `release:prod` workflow that ships the
#   app to the stores. GitHub and EAS run independently, so these checks cannot hold that release
#   back — they only mean a push that shipped something broken is visibly red rather than silently
#   green. Railway does not deploy from these branches.
#
# Not on push to `develop` any more. Every commit there is a squash of a pull request that was
# signed off at its head and up to date with `develop` (`strict_required_status_checks_policy`), so
# the tree is the one that was verified; a run there only repeated the answer, billed.

on:
  push:
    branches: [release/playground/*]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "report = run the checks only; signoff = a green run writes the signoff statuses"
        required: true
        type: choice
        options: [report, signoff]
        default: report
      pr:
        description: "Pull request number to test (blank = not a PR)"
        required: false
        type: string
      signoff-sha:
        description: "Commit SHA to test (blank = the PR's head, or the dispatched ref's tip)"
        required: false
        type: string

# No `paths:` filter. On a pull request the jobs are gated by `if:` to the release pull request
# instead: a skipped job bills nothing, and the gate itself is the signoff statuses, not these jobs.
#
# Runners are Namespace profiles, not GitHub-hosted labels. `namespace-profile-linux-small` is
# the default for everything here; a job that needs macOS (Xcode, a simulator) must use
# `namespace-profile-mac-small` instead, and one that needs Windows `namespace-profile-windows-small`.
# Nothing in this workflow needs either — `previews` is deliberately kept out of CI (see the build job).

# `statuses: write` is for the `signoff` job. The default token is read-only on statuses.
permissions:
  contents: read
  statuses: write

concurrency:
  # The target is in the key so two dispatches from the same ref for different PRs or SHAs do not
  # evict each other's pending run. Both inputs are empty outside a dispatch.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.pr }}-${{ inputs.signoff-sha }}
  # Pull requests only. A cancelled push run reports `cancelled`, which is not success, and a
  # red run on `develop` or a release branch should mean the tree is broken, not superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `bun install` resolves `@delacournz/*` from GitHub Packages (see `bunfig.toml`): a classic PAT
# with only `read:packages`, never a broader token.
env:
  TURBO_TELEMETRY_DISABLED: 1
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  # Picks the one commit every job below checks out and the `signoff` job writes statuses for, and
  # whether it writes them at all. Resolved once, up front: resolving again at signoff time would
  # sign whatever a PR's head had moved to while the checks ran.
  resolve:
    name: resolve
    if: github.event_name != 'pull_request' || github.head_ref == 'changeset-release/develop'
    runs-on: namespace-profile-linux-small
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sign: ${{ steps.resolve.outputs.sign }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MODE: ${{ inputs.mode }}
          PR: ${{ inputs.pr }}
          INPUT_SHA: ${{ inputs.signoff-sha }}
        # Inputs reach the script through env, never `${{ }}` inside it, so a crafted value cannot
        # become shell.
        run: |
          set -euo pipefail
          if [ "$EVENT" != "workflow_dispatch" ]; then
            SIGN=false
            [ "$EVENT" = "pull_request" ] && SIGN=true
            echo "sha=${EVENT_SHA}" >> "$GITHUB_OUTPUT"
            echo "sign=${SIGN}" >> "$GITHUB_OUTPUT"
            echo "→ ${EVENT}: ${EVENT_SHA} (sign: ${SIGN})"
            exit 0
          fi

          PR="${PR#\#}"
          SHA="$EVENT_SHA"
          if [ -n "$INPUT_SHA" ]; then
            # Expands a short SHA and proves the commit exists in this repository.
            SHA=$(gh api "repos/${REPO}/commits/${INPUT_SHA}" --jq .sha) \
              || { echo "::error::signoff-sha ${INPUT_SHA} is not a commit in ${REPO}"; exit 1; }
          fi

          if [ -n "$PR" ]; then
            [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number, got '${PR}'"; exit 1; }
            IFS=$'\t' read -r STATE HEAD_REPO HEAD_SHA < <(gh api "repos/${REPO}/pulls/${PR}" \
              --jq '[.state, (.head.repo.full_name // ""), .head.sha] | @tsv') \
              || { echo "::error::#${PR} is not a pull request in ${REPO}"; exit 1; }
            [ "$STATE" = "open" ] || { echo "::error::#${PR} is ${STATE}, not open"; exit 1; }
            # A fork's head is untrusted code; this run carries NPM_TOKEN and a status-writing token.
            [ "$HEAD_REPO" = "$REPO" ] || { echo "::error::#${PR} is from ${HEAD_REPO:-a deleted fork}; fork pull requests are not run here"; exit 1; }
            if [ -n "$INPUT_SHA" ] && [ "$SHA" != "$HEAD_SHA" ]; then
              echo "::error::#${PR}'s head is ${HEAD_SHA}, not ${SHA}; it moved, or the SHA is from another branch"
              exit 1
            fi
            SHA="$HEAD_SHA"
          fi

          SIGN=false
          [ "$MODE" = "signoff" ] && SIGN=true
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "sign=${SIGN}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${MODE}: \`${SHA}\`"
            [ -n "$PR" ] && echo "Pull request #${PR}"
            [ "$SIGN" = "true" ] && echo "A green run writes the signoff statuses for this commit." || echo "Report only — no statuses are written."
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: typecheck
    needs: resolve
    if: github.event_name != 'pull_request' || github.head_ref == 'changeset-release/develop'
    # tsc over every workspace at once outgrew the small profile: with the component stack applied,
    # the playground's tsc was OOM-killed (exit 137) on every run.
    runs-on: namespace-profile-linux-medium
    # No job here has ever taken more than a minute. The default is 360, which on a private repo
    # bills six hours against the plan's minutes if a runner ever wedges.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Matches `packageManager` in package.json — Railpack reads the same field to pick Bun.
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # `@delacour/web#typecheck` depends on `@delacour/web#codegen` (see turbo.jsonc): TanStack
      # Router generates the gitignored `apps/web/src/routeTree.gen.ts` during that build, and tsc
      # cannot run without it.
      - run: bun run typecheck

  check:
    name: check (lint + format)
    needs: resolve
    if: github.event_name != 'pull_request' || github.head_ref == 'changeset-release/develop'
    runs-on: namespace-profile-linux-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  test:
    name: test
    needs: resolve
    if: github.event_name != 'pull_request' || github.head_ref == 'changeset-release/develop'
    runs-on: namespace-profile-linux-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    name: build
    needs: resolve
    if: github.event_name != 'pull_request' || github.head_ref == 'changeset-release/develop'
    runs-on: namespace-profile-linux-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Scoped to the docs site on purpose. This is the only thing Railway deploys, and an
      # unfiltered `turbo build` would drag in the Expo playground for no benefit.
      #
      # This repeats the vite build the typecheck job already triggers. That is fifteen seconds,
      # and it buys an independent proof that the docs site builds on its own — which is the exact
      # command Railway runs.
      #
      # Never add `bun run previews` here. It drives an iOS simulator and needs a Mac with Xcode;
      # its outputs (apps/web/public/previews/**, apps/web/src/previews/manifest.ts) are committed
      # precisely so this builds on a simulator-less runner. See apps/web/AGENTS.md.
      - run: bun run build --filter=@delacour/web

  registry:
    name: registry
    needs: resolve
    if: github.event_name != 'pull_request' || github.head_ref == 'changeset-release/develop'
    runs-on: namespace-profile-linux-small
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # tsdown's bin runs under Node, and it picks its config loader from that Node: one with
      # native TypeScript (>= 22.18) loads tsdown.config.ts itself, an older one falls back to
      # the optional `unrun` package, which is not installed. The Namespace image ships an older
      # Node than GitHub's did, so pin one rather than depend on the image.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile

      # The registry is committed, so a component change that does not rebuild
      # it would publish a registry describing the previous version. It holds no
      # source — an item names `packages/react-native-ui/src/...` at the same ref — so
      # what drifts here is the metadata: a new file, a changed import, a
      # dependency that moved between `expo install` and the package manager.
      - name: Check the registry is current
        working-directory: packages/cli
        run: bun run registry:build

      - run: git diff --exit-code registry/

      # The docs site derives its per-component install block from the registry,
      # into a committed module. A stale one puts wrong dependencies and dead
      # file links on every component page, silently.
      - name: Check the docs install manifest is current
        working-directory: apps/web
        run: bun run gen-install

      - run: git diff --exit-code apps/web/src/registry/install.ts

      # The agent skill's component list is derived from the same registry. The
      # skill itself names no component on purpose, so this is only what
      # `delacour skills --list` prints — but a stale list is a stale list.
      - name: Check the skill's component list is current
        working-directory: packages/skills
        run: bun run gen-skill

      - run: git diff --exit-code packages/skills/src/components.generated.ts

      # Offline and fast: scaffolds an app, runs the CLI, and checks the shape
      # of what came out. The full run installs from npm and lives in its own job.
      # Both layouts: components in the app, and components in a shared package
      # several apps could use. The second has wiring the first does not — a
      # workspace link, an exports map, Metro's resolver — and none of it is
      # exercised by the first.
      - name: Verify both layouts (structure only)
        working-directory: packages/cli
        run: |
          bun run verify:expo --no-install
          bun run verify:expo --no-install --layout monorepo

  verify-expo:
    name: CLI against a real Expo app (${{ matrix.layout }})
    needs: resolve
    if: github.event_name != 'pull_request' || github.head_ref == 'changeset-release/develop'
    runs-on: namespace-profile-linux-small
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        layout: [standalone, monorepo]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # tsdown's bin runs under Node, and it picks its config loader from that Node: one with
      # native TypeScript (>= 22.18) loads tsdown.config.ts itself, an older one falls back to
      # the optional `unrun` package, which is not installed. The Namespace image ships an older
      # Node than GitHub's did, so pin one rather than depend on the image.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile

      # Scaffolds an Expo app, installs Uniwind and Tailwind, runs init and adds
      # every item, then typechecks the result. A clean tsc is the proof that
      # every copied component resolves every import it makes — which no fixture
      # test can establish, because a fixture has no dependency tree.
      # --bundle also runs the components through Metro, which is the only stage
      # that exercises Uniwind's transform. A class the scanner never saw is
      # dropped from the build silently, and tsc cannot see that at all.
      - name: Scaffold, install, typecheck and bundle
        working-directory: packages/cli
        run: bun run verify:expo --bundle --layout ${{ matrix.layout }}

  # Every component's suites copied into a real app on each runner a consumer may use, and run by
  # it — the `tests` signoff check. The conversion is two string substitutions held up by a build
  # guard; this is what proves the guard knew everything Jest and Vitest refuse.
  copied-tests:
    name: copied tests (${{ matrix.runner }})
    needs: resolve
    if: github.event_name != 'pull_request' || github.head_ref == 'changeset-release/develop'
    # The Jest and Vitest legs tsc the app with a render suite per component copied in, which ran
    # out of heap on the small profile ("Ineffective mark-compacts near heap limit") — as typecheck did.
    runs-on: namespace-profile-linux-medium
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        runner: [bun, jest, vitest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Copy every suite and run it
        working-directory: packages/cli
        run: bun run verify:expo --tests ${{ matrix.runner }}

  # Writes what `bun run signoff` would have, for the commit these jobs tested: every always-on
  # sub-context, then the umbrella last. `needs` covers every job above, so the umbrella is earned
  # only when all of them — registry, both verify-expo legs and both copied-tests legs included — passed.
  signoff:
    name: signoff
    needs: [resolve, typecheck, check, test, build, registry, verify-expo, copied-tests]
    # `sign` is true only for the version pull request and a dispatch with mode `signoff`. The
    # head-branch clause stays so the drift test can see this job is gated on `pull_request` too.
    if: >-
      success() && needs.resolve.outputs.sign == 'true' &&
      (github.event_name != 'pull_request' || github.head_ref == 'changeset-release/develop')
    runs-on: namespace-profile-linux-small
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PR: ${{ inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        # Same contexts as REQUIRED_CONTEXTS in scripts/signoff-checks.ts, which signoff.test.ts pins
        # against `.github/rulesets/develop.json`.
        run: |
          BY="passed in CI, triggered by ${ACTOR}${PR:+ for #${PR}}"
          for CONTEXT in signoff/typecheck signoff/check signoff/test signoff/build signoff; do
            gh api "repos/${{ github.repository }}/statuses/${SHA}" --method POST \
              -f state=success \
              -f "context=${CONTEXT}" \
              -f "description=${BY}" \
              -f "target_url=${RUN_URL}"
            echo "✓ ${CONTEXT} written for ${SHA}"
          done
