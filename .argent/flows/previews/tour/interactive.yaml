executionPrerequisite: >-
  The chrome-free preview route is open on tour/interactive and has settled — a recipe card with an unfilled heart and
  bookmark over a "Try it" button, the tour closed. The capture script navigates there before running this.
steps:
  - echo: Starting the tour on the heart
  - tap: { id: tour-interactive-start }
  - await: { visible: { id: tour-interactive-card } }
  - wait: 1100
  - echo: Tapping the heart through the hole likes it and advances to the bookmark
  - tap: { id: tour-interactive-like }
  - wait: 1100
  - echo: Saving finishes the tour
  - tap: { id: tour-interactive-save }
  - await: { hidden: { id: tour-interactive-card } }
  - wait: 700
  - echo: Unlike and unsave, so the clip loops back to where it began
  - tap: { id: tour-interactive-like }
  - wait: 250
  - tap: { id: tour-interactive-save }
