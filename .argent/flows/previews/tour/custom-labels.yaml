executionPrerequisite: >-
  The chrome-free preview route is open on tour/custom-labels and has settled — two icon buttons over a "Commencer"
  button, the tour closed. The capture script navigates there before running this.
steps:
  - echo: Starting the French tour — no Skip, progress as 1/2
  - tap: { id: tour-labels-start }
  - await: { visible: { id: tour-labels-next } }
  - wait: 1200
  - echo: Suivant moves to the second step, where Retour appears
  - tap: { id: tour-labels-next }
  - wait: 1200
  - echo: Terminé closes it, so the clip loops back to the closed screen
  - tap: { id: tour-labels-next }
  - await: { hidden: { id: tour-labels-card } }
