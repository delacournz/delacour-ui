executionPrerequisite: >-
  The chrome-free preview route is open on message-scroller/jump-to-latest and has settled — the list at its newest,
  with a reply arriving every two seconds. The capture script navigates there before running this.
steps:
  - echo: Scrolling up, away from the newest
  - swipe: { from: { id: message-scroller-jump }, by: { y: 0.3 }, duration: 500 }
  - wait: 500
  - echo: Holding while replies arrive, so the button's count climbs
  - await: { visible: { id: message-scroller-jump-button } }
  - wait: 3500
  - echo: Jumping back to the newest, where the clip began
  - tap: { id: message-scroller-jump-button }
  - wait: 900
