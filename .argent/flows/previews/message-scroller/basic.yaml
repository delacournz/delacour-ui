executionPrerequisite: >-
  The chrome-free preview route is open on message-scroller/basic and has settled — forty messages, opened at the
  newest. The capture script navigates there before running this.
steps:
  - echo: Scrolling back through the conversation
  - swipe: { from: { id: message-scroller-basic }, by: { y: 0.25 }, duration: 500 }
  - wait: 700
  - swipe: { from: { id: message-scroller-basic }, by: { y: 0.25 }, duration: 500 }
  - wait: 900
  - echo: And down to the newest again, so the clip loops without a jump cut
  - swipe: { from: { id: message-scroller-basic }, by: { y: -0.3 }, duration: 400 }
  - wait: 300
  - swipe: { from: { id: message-scroller-basic }, by: { y: -0.3 }, duration: 400 }
  - wait: 300
  - swipe: { from: { id: message-scroller-basic }, by: { y: -0.3 }, duration: 400 }
