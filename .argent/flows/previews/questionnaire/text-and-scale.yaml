executionPrerequisite: >-
  The chrome-free preview route is open on questionnaire/text-and-scale and has settled — the 0 to 10
  scale with 8 chosen. The capture script navigates there before running this.
steps:
  - echo: Moving along the scale
  - tap: { id: nps-recommend-3 }
  - wait: 450
  - tap: { id: nps-recommend-10 }
  - wait: 450
  - tap: { id: nps-recommend-8 }
  - wait: 450
  - echo: On to the text question and back, ending where it began
  - tap: { id: nps-next }
  - await: { visible: { id: nps-why } }
  - wait: 700
  - tap: { id: nps-back }
  - await: { visible: { id: nps-recommend-8 } }
  - wait: 400
