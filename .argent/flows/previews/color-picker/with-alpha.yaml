executionPrerequisite: >-
  The chrome-free preview route is open on color-picker/with-alpha and has settled — blue at 70%
  opacity, the alpha thumb most of the way along its track. The capture script navigates there
  before running this.
steps:
  - echo: Fading the colour out towards the checkerboard
  - swipe: { from: { id: color-picker-alpha-thumb }, by: { x: -0.4 }, momentum: false, duration: 900 }
  - wait: 500
  - echo: And back by the same distance, so the clip loops where it began
  - swipe: { from: { id: color-picker-alpha-thumb }, by: { x: 0.4 }, momentum: false, duration: 900 }
  - wait: 400
