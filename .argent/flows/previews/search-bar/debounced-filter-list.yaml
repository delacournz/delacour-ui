executionPrerequisite: >-
  The chrome-free preview route is open on search-bar/debounced-filter-list and has settled — an empty, unfocused
  search bar over the full list of two cities. The capture script navigates there before running this.
steps:
  - echo: Typing a query; the list filters once typing pauses
  - tap: { id: city-search }
  - wait: 300
  - tool: keyboard
    args: { text: wel, delayMs: 120 }
  - wait: 1000
  - echo: Clearing reports at once, so the full list returns without the debounce
  - tap: { id: city-search-clear }
  - wait: 600
  - echo: Submitting blurs the field, so the clip loops unfocused as it began
  - tool: keyboard
    args: { key: enter }
  - wait: 600
