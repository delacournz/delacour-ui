name: build:native:prod

defaults:
  tools:
    bun: 1.3.9

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
        description: "Marketing version to stamp, x.y.z. Omit to use app.config.ts's default."

jobs:
  # This workflow is manual only — `release:prod` is what a push to
  # `release/playground` triggers. Omitting the version lands on
  # `app.config.ts`'s own default; pass one to override it:
  # `bun eas:build:native:prod -F version=1.2.3`.
  extract_version:
    name: Extract Version
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        name: Parse version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ] && ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid version format: '$VERSION' (expected x.y.z)"
            exit 1
          fi
          echo "Version: ${VERSION:-<app.config.ts default>}"
          set-output version "$VERSION"

  # Generate fingerprint
  fingerprint:
    name: Generate Fingerprint
    type: fingerprint
    needs: [extract_version]

  # Build Android
  build_android:
    name: Build Android
    type: build
    needs: [fingerprint, extract_version]
    env:
      APP_VERSION: ${{ needs.extract_version.outputs.version }}
    params:
      platform: android
      profile: production

  # Build iOS
  build_ios:
    name: Build iOS
    type: build
    needs: [fingerprint, extract_version]
    env:
      APP_VERSION: ${{ needs.extract_version.outputs.version }}
    params:
      platform: ios
      profile: production

  # Submit Android Build
  submit_android_build:
    name: Submit Android Build
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}

  # Submit iOS Build
  submit_ios_build:
    name: Submit iOS Build
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
