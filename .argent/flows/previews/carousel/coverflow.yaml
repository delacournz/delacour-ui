executionPrerequisite: >-
  The chrome-free preview route is open on carousel/coverflow and has settled — seven covers, the
  fourth centred and facing forward, its neighbours turned. The viewport carries the testID
  carousel-coverflow-content. The capture script navigates there before running this.
steps:
  - echo: Turning to the next cover, then the one after
  - swipe: { from: { id: carousel-coverflow-content }, by: { x: -0.3 }, momentum: false, duration: 450 }
  - wait: 700
  - swipe: { from: { id: carousel-coverflow-content }, by: { x: -0.3 }, momentum: false, duration: 450 }
  - wait: 700
  - echo: And back to the fourth, so the clip loops without a jump cut
  - swipe: { from: { id: carousel-coverflow-content }, by: { x: 0.3 }, momentum: false, duration: 450 }
  - wait: 700
  - swipe: { from: { id: carousel-coverflow-content }, by: { x: 0.3 }, momentum: false, duration: 450 }
  - wait: 700
