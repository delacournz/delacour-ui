executionPrerequisite: >-
  The chrome-free preview route is open on flow/controls-minimap and has settled — twelve step cards at zoom 0.9, with
  the controls (flow-zoom-in, flow-zoom-out) and the minimap floating over the canvas. The capture script navigates
  there before running this.
steps:
  - echo: Zooming out twice, so more of the graph comes on screen and the minimap's window grows to frame it
  - tap: { id: flow-zoom-out }
  - wait: 450
  - tap: { id: flow-zoom-out }
  - wait: 800
  - echo: And in by the same two steps, so the clip loops at the zoom it began at
  - tap: { id: flow-zoom-in }
  - wait: 450
  - tap: { id: flow-zoom-in }
