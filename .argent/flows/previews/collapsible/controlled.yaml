executionPrerequisite: >-
  The chrome-free preview route is open on collapsible/controlled and has
  settled — Delivery notes closed, a Show notes button under it and a caption
  reading Closed. The capture script navigates there before running this.
steps:
  - echo: Opening it from the button outside the collapsible
  - tap: { id: controlled-button }
  - wait: 1000
  - echo: And closing it from its own trigger, so the clip loops without a jump cut
  - tap: { id: controlled-trigger }
