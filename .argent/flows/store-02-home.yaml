executionPrerequisite: >-
  The app is running with argent's devtools bridge live, on any screen — goldie
  installs and launches it before the first scene, and every scene after that
  inherits the process the last one left. Nothing here needs a fresh process.
steps:
  - echo: Refresh, not relaunch — the home deep link resets navigation in the running process
  - tool: open-url
    args: { url: "dlc-ui-playground:///" }
  - await: { visible: { id: theme-trigger } }
  - echo: Zinc base and amber accent are the house palette; the customizer starts from library default on a fresh install
  - tap: { id: theme-trigger }
  - await: { visible: { id: theme-base-color-zinc } }
  - tap: { id: theme-base-color-zinc }
  - wait: 500
  - tap: { id: theme-accent-amber }
  - wait: 400
  - tap: { text: Back }
  - await: { visible: { text: 19 components } }
  - await: { idle: true }
