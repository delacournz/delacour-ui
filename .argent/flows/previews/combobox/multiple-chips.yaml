executionPrerequisite: >-
  The chrome-free preview route is open on combobox/multiple-chips and has settled — a trigger holding two chips,
  React Native and TypeScript, the sheet closed. The capture script navigates there before running this.
steps:
  - echo: Opening the sheet and finding Swift
  - tap: { id: combobox-multiple-chevron }
  - await: { visible: { id: combobox-multiple-search } }
  - wait: 700
  - tool: keyboard
    args: { text: sw, delayMs: 150 }
  - wait: 500
  - echo: The pick adds a chip and keeps the sheet and the keyboard up
  - tap: { id: combobox-multiple-option-swift }
  - wait: 700
  - tap: { id: combobox-multiple-done }
  - await: { hidden: { id: combobox-multiple-search } }
  - wait: 700
  - echo: Removing the new chip from the trigger, so the clip loops with two
  - tap: { id: combobox-multiple-remove-swift }
  - wait: 600
