executionPrerequisite: >-
  The chrome-free preview route is open on tree/file-browser and has settled — src and components open, button.tsx
  selected, hooks and assets closed. The capture script navigates there before running this.
steps:
  - echo: Opening hooks and selecting the file inside it
  - tap: { id: file-browser-src/hooks }
  - wait: 500
  - tap: { id: file-browser-src/hooks/use-theme.ts }
  - wait: 600
  - echo: Closing hooks and selecting button.tsx again, so the clip loops without a jump cut
  - tap: { id: file-browser-src/hooks }
  - wait: 500
  - tap: { id: file-browser-src/components/button.tsx }
  - wait: 500
