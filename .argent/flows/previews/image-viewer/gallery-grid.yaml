executionPrerequisite: >-
  The chrome-free preview route is open on image-viewer/gallery-grid, captured as the whole screen, and has settled —
  six thumbnails in a three-column grid, the viewer closed. The capture script navigates there before running this.
steps:
  - await: { visible: { id: image-viewer-trigger-orchard } }
  - echo: Opening the third tile, which flies out of its own frame
  - tap: { id: image-viewer-trigger-orchard }
  - await: { text: { in: { id: image-viewer-counter }, contains: 3 / 6 } }
  - wait: 900
  - echo: Swiping to the next photo
  - swipe: { from: { id: image-viewer-page-2 }, by: { x: -0.5 }, duration: 250 }
  - await: { text: { in: { id: image-viewer-counter }, contains: 4 / 6 } }
  - wait: 900
  - echo: Closing flies the new photo home to its own tile
  - tap: { id: image-viewer-close }
  - await: { hidden: { id: image-viewer-counter } }
