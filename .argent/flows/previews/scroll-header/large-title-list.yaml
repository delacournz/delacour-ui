executionPrerequisite: >-
  The chrome-free preview route is open on scroll-header/large-title-list and has settled — the large "Library" title
  over a list of albums, the bar holding only its two buttons. The capture script navigates there before running this.
steps:
  - echo: Scrolling the list up — the large title leaves and the bar's own title fades in with its surface
  - swipe: { from: { id: scroll-header-list }, by: { y: -0.3 }, momentum: false, duration: 1400 }
  - wait: 800
  - echo: And back to the top, where the large title returns, so the clip loops without a jump cut
  - swipe: { from: { id: scroll-header-list }, by: { y: 0.35 }, momentum: false, duration: 1400 }
  - wait: 800
