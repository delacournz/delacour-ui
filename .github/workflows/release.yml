name: release

# Publishes a release: GitHub Release + npm packages for one `v*` tag.
#
# Nobody pushes this tag by hand. The flow is:
#
#   changeset PR ─▶ develop ─▶ version.yml opens the "🔖 chore(release): vX.Y.Z" PR
#   merge it ─▶ develop @ V ─▶ promote.yml fast-forwards `main` to V, then pushes the annotated tag vX.Y.Z
#   tag push ─▶ this workflow (Railway production builds `main` at the same commit)
#
# The four published packages — `delacour` (the CLI), `@delacour/react-native-ui`,
# `@delacour/react-native-charts` and `@delacour/react-native-bottom-sheet` — are one `fixed`
# changesets group, so every one of them is at the tag's version and every release ships all four,
# changed or not.
#
# Because the trigger is a bare tag, anything able to create `v*` tags could start a publish. Two
# checks keep that honest: the `release-tags` ruleset (.github/rulesets/release-tags.json) restricts
# who may create them (the delacour-release App from promote.yml, and repo admins), and `build`
# below refuses a tag whose commit is not on `main`, so a tag made off a feature branch cannot publish.
#
# Alphas are not this file's job: `alpha.yml` publishes a snapshot on every merge to `develop`.
on:
  push:
    tags: ["v*"]

permissions: {}

# Never let two releases interleave; a cancelled publish is worse than a slow one.
concurrency:
  group: release
  cancel-in-progress: false

# Build and publish are split so dependency code never runs next to publish
# credentials: `build` installs/compiles with a read-only token and no registry secret;
# `publish` holds the OIDC + release write permissions but never installs or
# executes repo dependencies. `build` runs on Namespace like CI; `publish` stays
# on a GitHub-hosted runner — npm trusted publishing + provenance refuse
# self-hosted ones (`E422 Unsupported GitHub Actions runner environment: "self-hosted"`),
# which is what a Namespace profile is to GitHub.
jobs:
  build:
    if: github.repository_owner == 'delacournz'
    # Medium, not small: typecheck across every workspace was OOM-killed on the small profile.
    runs-on: namespace-profile-linux-medium
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # `bun install` resolves `@delacournz/*` from GitHub Packages (see `bunfig.toml`): a classic PAT
      # with only `read:packages`. Never reaches the publish job.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The CLI serves components straight out of `registry/` at this ref. The commit, not the tag:
      # a SHA is immutable, and raw.githubusercontent.com serves it.
      DELACOUR_REGISTRY_REF: ${{ github.sha }}
    steps:
      # fetch-depth 0: the ancestry check below needs origin/main, not just the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # promote.yml pushes main before the tag, so a legitimate release tag is always already
      # reachable from main. Fails first, before any dependency code runs.
      - name: Tag commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main: refusing to publish" >&2
            exit 1
          fi

      - name: Tag must match every published package's version
        run: |
          for dir in packages/cli packages/react-native-ui packages/react-native-charts packages/react-native-bottom-sheet; do
            version=$(jq -r .version "$dir/package.json")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "tag $GITHUB_REF_NAME does not match $dir/package.json version $version" >&2
              exit 1
            fi
          done

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # tsdown's bin runs under Node and needs one with native TypeScript to load its config.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run check
      - run: bun run test

      # The CLI serves components straight out of `registry/` at the commit it was built from, so a
      # stale registry ships an `add` that hands over components which no longer match their source.
      # Signoff checks this on every pull request; check it again here, because this is the copy that ships.
      - name: Rebuild the registry
        working-directory: packages/cli
        run: bun run registry:build

      - name: Fail if the committed registry is stale
        run: |
          if [ -n "$(git status --porcelain registry/)" ]; then
            echo "registry/ does not match packages/react-native-ui. Run 'bun --filter delacour run registry:build' and commit the result."
            git --no-pager diff --stat registry/
            exit 1
          fi

      - name: Build the CLI
        working-directory: packages/cli
        run: bun run build && bun run build:check

      # npm, not bun: these are the tarballs `publish` uploads byte for byte. --ignore-scripts so the
      # CLI's `prepublishOnly` rebuild cannot run here with a different environment than the build above.
      - name: Pack npm tarballs
        run: |
          mkdir -p dist
          for dir in packages/react-native-charts packages/react-native-bottom-sheet packages/react-native-ui packages/cli; do
            npm pack "./$dir" --pack-destination dist --ignore-scripts
          done
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No required reviewer: merging the version PR is the approval. The environment stays because
    # npm's trusted publisher is bound to this workflow file + environment name, and its deployment
    # branch policy (tags `v*`) still limits where a publish can start.
    environment: release
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm is older.
      - name: Update npm for OIDC
        run: npm install -g npm@latest

      # A rerun after a failed npm publish finds the release already created: replace its assets
      # instead of failing on create, so `gh run rerun --failed` can finish the publish.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/*.tgz)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, replacing assets"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # Engines first so @delacour/react-native-ui's peers resolve the moment it lands; the CLI last,
      # since it installs the libraries at its own version line.
      # Already-published versions are skipped, so a re-run finishes a partial publish.
      # Auth is OIDC trusted publishing (npm >= 11.5.1) only. Never pass NPM_TOKEN here: it is the
      # GitHub Packages read token for `bun install`, and npm would send it to registry.npmjs.org.
      # --ignore-scripts: nothing in the tarballs runs here.
      - name: Publish to npm
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          provenance=""
          if [ "$REPO_PRIVATE" = "false" ]; then provenance="--provenance"; fi
          for tgz in dist/delacour-react-native-charts-*.tgz dist/delacour-react-native-bottom-sheet-*.tgz dist/delacour-react-native-ui-*.tgz dist/delacour-[0-9]*.tgz; do
            manifest=$(tar -xOzf "$tgz" package/package.json)
            name=$(echo "$manifest" | jq -r .name)
            version=$(echo "$manifest" | jq -r .version)
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            npm publish "./$tgz" --access public --tag latest --ignore-scripts $provenance
          done
