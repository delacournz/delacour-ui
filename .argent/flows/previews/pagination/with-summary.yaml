executionPrerequisite: >-
  The chrome-free preview route is open on pagination/with-summary and has settled — "41–60 of 472" at the start, the
  compact readout on 3 / 24 at the end. The capture script navigates there before running this.
steps:
  - echo: Two pages on — the status follows the readout
  - tap: { text: Next page, within: { id: pagination-summary } }
  - wait: 450
  - tap: { text: Next page, within: { id: pagination-summary } }
  - wait: 700
  - echo: And two back, so the clip loops on page 3
  - tap: { text: Previous page, within: { id: pagination-summary } }
  - wait: 450
  - tap: { text: Previous page, within: { id: pagination-summary } }
