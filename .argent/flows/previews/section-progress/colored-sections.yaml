executionPrerequisite: >-
  The chrome-free preview route is open on section-progress/colored-sections and has settled — release
  notes scrolled to the top, the pill reading "Summary" with an empty ring. The capture script navigates
  there before running this.
steps:
  - echo: Reading down the notes, so the ring fills and takes each section's colour
  # momentum:false so each swipe moves the content by what the finger did, and
  # the clip reaches the same section on every run.
  - swipe: { from: { id: section-progress-colored-scroll }, by: { y: -0.3 }, momentum: false, duration: 500 }
  - wait: 300
  - swipe: { from: { id: section-progress-colored-scroll }, by: { y: -0.3 }, momentum: false, duration: 500 }
  - wait: 300
  - swipe: { from: { id: section-progress-colored-scroll }, by: { y: -0.3 }, momentum: false, duration: 500 }
  - wait: 300
  - swipe: { from: { id: section-progress-colored-scroll }, by: { y: -0.3 }, momentum: false, duration: 500 }
  - wait: 600
  - echo: Opening the panel and jumping back to the first section, so the clip loops without a jump cut
  - tap: { id: section-progress-colored-pill }
  - wait: 900
  - tap: { id: section-progress-colored-summary }
  - wait: 1200
