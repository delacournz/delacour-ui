executionPrerequisite: >-
  The chrome-free preview route is open on planner/training-plan and has settled — the current
  month in the grid with today ringed, nothing selected, and the Today button disabled. The capture
  script navigates there before running this.
steps:
  - echo: Swiping the grid pages to next month, sliding in from the right
  - swipe: { from: { id: planner-training-grid }, by: { x: -0.5 }, momentum: false, duration: 300 }
  - wait: 1000
  - echo: The previous-month button slides back, so the clip loops on the month it began with
  - tap: { id: planner-training-nav-previous }
  - wait: 900
