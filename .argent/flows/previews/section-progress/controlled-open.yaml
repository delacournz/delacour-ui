executionPrerequisite: >-
  The chrome-free preview route is open on section-progress/controlled-open and has settled — "Panel
  closed" beside an "Open chapters" button, and the pill reading "The crossing". The capture script
  navigates there before running this.
steps:
  - echo: The button outside opens the panel
  - tap: { id: section-progress-controlled-toggle }
  - wait: 1100
  - echo: And the pill closes it through the same callback, so the clip loops without a jump cut
  - tap: { id: section-progress-controlled-pill }
  - wait: 500
