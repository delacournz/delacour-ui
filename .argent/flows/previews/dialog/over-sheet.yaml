executionPrerequisite: >-
  The chrome-free preview route is open on dialog/over-sheet and has settled — the Open sheet button with the sheet and
  the dialog closed. The capture script navigates there before running this.
steps:
  - echo: Opening the sheet
  - tap: { id: dialog-sheet-open }
  - await: { visible: { id: dialog-sheet-revoke } }
  - wait: 700
  - echo: The dialog it opens draws above it
  - tap: { id: dialog-sheet-revoke }
  - await: { visible: { id: dialog-sheet-confirm } }
  - wait: 1100
  - tap: { id: dialog-sheet-confirm }
  - await: { hidden: { id: dialog-sheet-confirm } }
  - wait: 500
  - echo: Dragging the sheet down, so the clip loops
  - swipe: { from: { text: Share project }, by: { y: 0.15 }, duration: 200 }
  - await: { hidden: { id: dialog-sheet-revoke } }
