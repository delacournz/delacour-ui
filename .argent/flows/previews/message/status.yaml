executionPrerequisite: >-
  The chrome-free preview route is open on message/status and has settled — the top message sending, the bottom one
  failed with a Retry beside its receipt. The capture script navigates there before running this.
steps:
  - echo: Walking the top receipt through sent, delivered and read
  - tap: { id: message-status-next }
  - wait: 600
  - tap: { id: message-status-next }
  - wait: 600
  - tap: { id: message-status-next }
  - wait: 900
  - echo: Retrying the failed one, then failing it again
  - tap: { text: Retry }
  - wait: 900
  - tap: { id: message-status-fail }
  - wait: 600
  - echo: And back to sending, so the clip loops without a jump cut
  - tap: { id: message-status-next }
