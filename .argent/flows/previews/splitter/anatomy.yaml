executionPrerequisite: >-
  The chrome-free preview route is open on splitter/anatomy and has settled — two
  panes at 50/50, the handle between them carrying the testID handle-0. The
  capture script navigates there before running this.
steps:
  - echo: Dragging the seam toward the trailing edge
  # Anchored on the handle rather than a coordinate, so a layout change moves the
  # gesture with it. momentum:false so the seam stops where the finger does.
  - swipe: { from: { id: handle-0 }, by: { x: 0.2 }, momentum: false, duration: 700 }
  - wait: 500
  - echo: And back past the middle, into the leading pane's floor
  - swipe: { from: { id: handle-0 }, by: { x: -0.4 }, momentum: false, duration: 900 }
  - wait: 500
  - echo: Back to the middle, so the clip loops near where it began
  - swipe: { from: { id: handle-0 }, by: { x: 0.2 }, momentum: false, duration: 700 }
