executionPrerequisite: >-
  The chrome-free preview route is open on sketch/default and has settled — the
  full toolset under a canvas seeded with an ellipse, an arrow and a wave, the
  pen in hand in the foreground ink. The default layout gives the canvas the
  testID sketch-canvas, the undo button sketch-undo and each swatch
  sketch-swatch-<colour>. The capture script navigates there before running this.
steps:
  - echo: A freehand wave in the foreground ink, under the seeded drawing
  # A raw gesture-custom rather than a swipe: a swipe is one straight line, and
  # a pen stroke is the curve the finger takes. The points sit in the canvas's
  # empty lower half, in screen fractions of the stage the route centres.
  - tool: gesture-custom
    args:
      interpolate: 4
      events:
        - { type: Down, x: 0.150, y: 0.530 }
        - { type: Move, x: 0.179, y: 0.549, delayMs: 40 }
        - { type: Move, x: 0.207, y: 0.559, delayMs: 40 }
        - { type: Move, x: 0.236, y: 0.557, delayMs: 40 }
        - { type: Move, x: 0.264, y: 0.543, delayMs: 40 }
        - { type: Move, x: 0.293, y: 0.523, delayMs: 40 }
        - { type: Move, x: 0.321, y: 0.507, delayMs: 40 }
        - { type: Move, x: 0.350, y: 0.500, delayMs: 40 }
        - { type: Move, x: 0.379, y: 0.507, delayMs: 40 }
        - { type: Move, x: 0.407, y: 0.523, delayMs: 40 }
        - { type: Move, x: 0.436, y: 0.543, delayMs: 40 }
        - { type: Move, x: 0.464, y: 0.557, delayMs: 40 }
        - { type: Move, x: 0.493, y: 0.559, delayMs: 40 }
        - { type: Move, x: 0.521, y: 0.549, delayMs: 40 }
        - { type: Up, x: 0.550, y: 0.530, delayMs: 40 }
  - wait: 250
  - echo: Red ink, and a loop drawn round the end of it
  - tap: { id: sketch-swatch-destructive }
  # The ink reaches the pan through a shared value a render later; draw before
  # it lands and the loop comes out in the old ink.
  - wait: 400
  - tool: gesture-custom
    args:
      interpolate: 4
      events:
        - { type: Down, x: 0.790, y: 0.500 }
        - { type: Move, x: 0.782, y: 0.519, delayMs: 45 }
        - { type: Move, x: 0.758, y: 0.534, delayMs: 45 }
        - { type: Move, x: 0.724, y: 0.543, delayMs: 45 }
        - { type: Move, x: 0.686, y: 0.544, delayMs: 45 }
        - { type: Move, x: 0.650, y: 0.537, delayMs: 45 }
        - { type: Move, x: 0.623, y: 0.524, delayMs: 45 }
        - { type: Move, x: 0.611, y: 0.505, delayMs: 45 }
        - { type: Move, x: 0.614, y: 0.486, delayMs: 45 }
        - { type: Move, x: 0.634, y: 0.469, delayMs: 45 }
        - { type: Move, x: 0.666, y: 0.458, delayMs: 45 }
        - { type: Move, x: 0.704, y: 0.455, delayMs: 45 }
        - { type: Move, x: 0.741, y: 0.460, delayMs: 45 }
        - { type: Move, x: 0.771, y: 0.472, delayMs: 45 }
        - { type: Move, x: 0.788, y: 0.489, delayMs: 45 }
        - { type: Move, x: 0.788, y: 0.509, delayMs: 45 }
        - { type: Up, x: 0.773, y: 0.526, delayMs: 45 }
  - wait: 700
  - echo: Undo both and take the foreground ink back, so the clip loops on the seed
  - tap: { id: sketch-undo }
  - wait: 200
  - tap: { id: sketch-undo }
  - tap: { id: sketch-swatch-foreground }
