executionPrerequisite: >-
  The chrome-free preview route is open on image-viewer/drag-to-dismiss, captured as the whole screen, and has settled —
  one round thumbnail centred on screen, the viewer closed. The capture script navigates there before running this.
steps:
  - await: { visible: { id: image-viewer-trigger-lighthouse } }
  - echo: Opening the photo
  - tap: { id: image-viewer-trigger-lighthouse }
  - await: { visible: { id: image-viewer-close } }
  - wait: 900
  - echo: A short drag springs back
  - swipe: { from: { id: image-viewer-page-0 }, by: { y: 0.07 }, duration: 400, momentum: false }
  - wait: 900
  - echo: A longer one sends it home to the thumbnail
  - swipe: { from: { id: image-viewer-page-0 }, by: { y: 0.3 }, duration: 350, momentum: false }
  - await: { hidden: { id: image-viewer-close } }
