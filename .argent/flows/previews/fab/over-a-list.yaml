executionPrerequisite: >-
  The chrome-free preview route is open on fab/over-a-list and has settled — the list scrolled to the top, the fab
  pinned bottom-end. The capture script navigates there before running this.
steps:
  - echo: Scrolling the list under the fab, which stays pinned
  - swipe: { from: { id: fab-list }, by: { y: -0.3 }, momentum: false }
  - wait: 600
  - echo: And back to the top, so the clip loops without a jump cut
  - swipe: { from: { id: fab-list }, by: { y: 0.3 }, momentum: false }
  - wait: 600
