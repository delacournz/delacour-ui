name: build:native:prod

defaults:
  tools:
    bun: 1.3.9

on:
  push:
    branches:
      - release/app/*
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
        description: "Version to build, x.y.z. Defaults to the release/app/* branch name."

jobs:
  # Version comes from the `release/app/x.y.z` branch on a push-triggered run.
  # A manual `eas workflow:run` has no ref_name, so the `version` input is the
  # way in: `bun eas:build:native:prod -F version=1.0.0`.
  extract_version:
    name: Extract Version
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        name: Parse version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            REF_NAME="${{ github.ref_name }}"
            VERSION="${REF_NAME##release/app/}"
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid version format: '$VERSION' (expected x.y.z)"
            echo "Pass one explicitly with -F version=x.y.z, or push to release/app/x.y.z."
            exit 1
          fi
          echo "Version: $VERSION"
          set-output version "$VERSION"

  # Generate fingerprint
  fingerprint:
    name: Generate Fingerprint
    type: fingerprint
    needs: [extract_version]

  # Build Android
  build_android:
    name: Build Android
    type: build
    needs: [fingerprint, extract_version]
    env:
      APP_VERSION: ${{ needs.extract_version.outputs.version }}
    params:
      platform: android
      profile: production

  # Build iOS
  build_ios:
    name: Build iOS
    type: build
    needs: [fingerprint, extract_version]
    env:
      APP_VERSION: ${{ needs.extract_version.outputs.version }}
    params:
      platform: ios
      profile: production

  # Submit Android Build
  submit_android_build:
    name: Submit Android Build
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}

  # Submit iOS Build
  submit_ios_build:
    name: Submit iOS Build
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
