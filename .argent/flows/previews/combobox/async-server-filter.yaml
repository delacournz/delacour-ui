executionPrerequisite: >-
  The chrome-free preview route is open on combobox/async-server-filter and has settled — one empty trigger reading
  "Assign someone", the sheet closed. The capture script navigates there before running this.
steps:
  - echo: Opening the sheet; the simulated server answers after a short delay
  - tap: { id: combobox-server }
  - await: { visible: { id: combobox-server-search } }
  - wait: 900
  - echo: Typing narrows the results the server sends back
  - tool: keyboard
    args: { text: ar, delayMs: 160 }
  - await: { visible: { id: combobox-server-option-omar } }
  - wait: 900
  - tap: { id: combobox-server-option-omar }
  - await: { hidden: { id: combobox-server-search } }
  - wait: 900
  - echo: Clearing it, so the clip loops back to the placeholder
  - tap: { id: combobox-server-clear }
  - wait: 600
