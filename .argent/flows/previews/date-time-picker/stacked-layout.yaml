executionPrerequisite: >-
  The chrome-free preview route is open on date-time-picker/stacked-layout and has settled — the
  trigger reads Wed, Oct 14 at 9:00 AM and the sheet is closed. The capture script navigates
  there before running this.
# Each wheel column is dragged once per opening. A column that has already settled can miss
# a second drag (it is still realigning), so the way back to the start is a second opening.
steps:
  - echo: Opening the sheet, then the wheel under the time row
  - tap: { id: date-time-picker-stacked-trigger }
  - await: { visible: { id: date-time-picker-stacked-time-row } }
  - wait: 600
  - tap: { id: date-time-picker-stacked-time-row }
  - await: { visible: { text: Hour } }
  - wait: 800
  - echo: Rolling the hour back
  - swipe: { from: { text: Hour }, by: { y: 0.09 }, momentum: false, duration: 600 }
  - wait: 1000
  - tap: { id: date-time-picker-stacked-done }
  - await: { hidden: { id: date-time-picker-stacked-calendar } }
  - wait: 900
  - echo: Reopening to roll it forward to 9, so the clip loops on 9:00 AM
  - tap: { id: date-time-picker-stacked-trigger }
  - await: { visible: { id: date-time-picker-stacked-time-row } }
  - wait: 600
  - tap: { id: date-time-picker-stacked-time-row }
  - await: { visible: { text: Hour } }
  - wait: 800
  - swipe: { from: { text: Hour }, by: { y: -0.09 }, momentum: false, duration: 600 }
  - wait: 1000
  - tap: { id: date-time-picker-stacked-done }
  - await: { hidden: { id: date-time-picker-stacked-calendar } }
  - wait: 500
