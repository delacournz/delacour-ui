executionPrerequisite: >-
  The chrome-free preview route is open on stack-card/undo and has settled — a deck of four flashcards with the first
  (testID undo-card-0) on top and the Again, Undo and Got it buttons under it. The capture script navigates there
  before running this.
steps:
  - echo: Throwing the first card right and the second left
  - swipe: { from: { id: undo-card-0 }, by: { x: 0.45 }, duration: 400 }
  - wait: 600
  - swipe: { from: { id: undo-card-1 }, by: { x: -0.45 }, duration: 400 }
  - wait: 700
  - echo: Undoing both — each returns from the side it left — so the clip loops on the first card
  - tap: { id: undo-undo }
  - wait: 700
  - tap: { id: undo-undo }
  - wait: 600
