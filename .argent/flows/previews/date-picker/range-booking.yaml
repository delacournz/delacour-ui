executionPrerequisite: >-
  The chrome-free preview route is open on date-picker/range-booking and has settled — the field
  shows its placeholder and the sheet is closed. The capture script navigates there before running this.
steps:
  - echo: Opening the sheet and picking the 12th to the 16th — it closes once both ends exist
  - tap: { id: date-picker-range-trigger }
  - await: { visible: { id: date-picker-range-calendar-day-2026-10-12 } }
  - wait: 500
  - tap: { id: date-picker-range-calendar-day-2026-10-12 }
  - wait: 600
  - tap: { id: date-picker-range-calendar-day-2026-10-16 }
  - await: { hidden: { id: date-picker-range-calendar } }
  - wait: 1000
  - echo: Clearing it, so the clip loops
  - tap: { id: date-picker-range-trigger }
  - await: { visible: { id: date-picker-range-clear } }
  - wait: 400
  - tap: { id: date-picker-range-clear }
  - wait: 400
  - tap: { id: date-picker-range-done }
  - await: { hidden: { id: date-picker-range-calendar } }
  - wait: 500
