executionPrerequisite: >-
  The chrome-free preview route is open on combobox/custom-value and has settled — a trigger holding two chips, Bug and
  Needs triage, the sheet closed. The capture script navigates there before running this.
steps:
  - echo: Opening from the chevron, clear of the chips; typing a label no option has brings the create row
  - tap: { id: combobox-custom-chevron }
  - await: { visible: { id: combobox-custom-search } }
  - wait: 700
  - tool: keyboard
    args: { text: Urgent, delayMs: 120 }
  - await: { visible: { id: combobox-custom-create } }
  - wait: 500
  - tap: { id: combobox-custom-create }
  - wait: 700
  - tap: { id: combobox-custom-done }
  - await: { hidden: { id: combobox-custom-search } }
  - wait: 700
  - echo: Removing it again, so the clip loops with two chips
  - tap: { id: combobox-custom-remove-Urgent }
  - wait: 600
