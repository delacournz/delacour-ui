executionPrerequisite: >-
  The chrome-free preview route is open on compare/anatomy and has settled — one 4:3 comparison, Draft on the left and
  Final on the right, its seam at the centre on the handle carrying the testID compare-anatomy-handle. The capture
  script navigates there before running this.
steps:
  - echo: Dragging the seam toward Draft, revealing the finished scene
  # momentum:false so the seam stops where the finger does, and the three legs sum to zero so the clip loops at the
  # centre it began on.
  - swipe: { from: { id: compare-anatomy-handle }, by: { x: -0.3 }, momentum: false, duration: 700 }
  - wait: 400
  - echo: Across to Final, covering it with the draft
  - swipe: { from: { id: compare-anatomy-handle }, by: { x: 0.6 }, momentum: false, duration: 1000 }
  - wait: 400
  - echo: And back to the centre, so the clip loops without a jump cut
  - swipe: { from: { id: compare-anatomy-handle }, by: { x: -0.3 }, momentum: false, duration: 700 }
