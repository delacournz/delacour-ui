name: Retarget PR

# `main` is the default branch so that the repository's front page shows the last release, and
# GitHub offers the default branch as the base of every new pull request. It has no separate setting
# for "base new PRs on X", so this does it after the fact: a pull request opened against `main` is
# moved to `develop`, where work lands. `main` only moves when `promote.yml` fast-forwards it.
#
# Same-repo pull requests only; a fork pull request opened against `main` is retargeted by hand.
# `pull_request`, never `pull_request_target`: the target event is the one the fork approval setting
# ("require approval for all external contributors") does not gate, so any stranger's fork pull
# request would start a job on our runners with a write token. Under `pull_request` a same-repo
# branch gets the write token this needs, a fork waits for approval, and the `if:` skips it even
# once approved — its token is read-only, so `gh pr edit` would only fail.
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  retarget:
    name: retarget to develop
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: namespace-profile-linux-small
    timeout-minutes: 5
    steps:
      - name: Move the base to develop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR" --base develop
          gh pr comment "$PR" --body "Retargeted to \`develop\`. \`main\` only moves on a release — see [Branches](https://github.com/$GH_REPO/blob/main/AGENTS.md#branches)."
