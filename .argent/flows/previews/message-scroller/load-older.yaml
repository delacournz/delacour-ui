executionPrerequisite: >-
  The chrome-free preview route is open on message-scroller/load-older and has settled — the newest page of twenty,
  opened at the end. The capture script navigates there before running this.
steps:
  - echo: Scrolling to the top, which loads the next page above
  - swipe: { from: { id: message-scroller-older }, by: { y: 0.35 }, duration: 350 }
  - wait: 400
  - swipe: { from: { id: message-scroller-older }, by: { y: 0.35 }, duration: 350 }
  - wait: 1600
  - echo: And back down to the newest, so the clip loops without a jump cut
  - swipe: { from: { id: message-scroller-older }, by: { y: -0.35 }, duration: 250 }
  - wait: 200
  - swipe: { from: { id: message-scroller-older }, by: { y: -0.35 }, duration: 250 }
  - wait: 200
  - swipe: { from: { id: message-scroller-older }, by: { y: -0.35 }, duration: 250 }
  - wait: 200
  - swipe: { from: { id: message-scroller-older }, by: { y: -0.35 }, duration: 250 }
