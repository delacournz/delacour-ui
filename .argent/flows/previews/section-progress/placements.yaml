executionPrerequisite: >-
  The chrome-free preview route is open on section-progress/placements and has settled — six placement
  buttons, "Bottom centre" selected, and the pill reading "Pricing" at the bottom of the stage. The capture
  script navigates there before running this.
steps:
  - echo: Moving the pill round the stage
  - tap: { id: section-progress-placement-top-center }
  - wait: 600
  - tap: { id: section-progress-placement-top-end }
  - wait: 500
  - echo: A top pill opens its panel downward
  - tap: { id: section-progress-placement-pill }
  - wait: 900
  - tap: { id: section-progress-placement-pill }
  - wait: 500
  - tap: { id: section-progress-placement-bottom-start }
  - wait: 600
  - echo: And back to the bottom centre, so the clip loops without a jump cut
  - tap: { id: section-progress-placement-bottom-center }
