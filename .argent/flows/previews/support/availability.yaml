executionPrerequisite: >-
  The chrome-free preview route is open on support/availability and has settled — both status
  lines reading online. The capture script navigates there before running this.
steps:
  - echo: Cycle to away — the dot turns amber and both lines change together
  - tap: { id: support-cycle }
  - wait: 900
  - echo: Cycle to offline
  - tap: { id: support-cycle }
  - wait: 900
  - echo: Cycle back to online, so the clip loops
  - tap: { id: support-cycle }
  - wait: 900
