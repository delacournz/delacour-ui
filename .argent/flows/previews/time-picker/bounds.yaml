executionPrerequisite: >-
  The chrome-free preview route is open on time-picker/bounds and has settled — an inline
  wheel at 12:00 PM, bounded to 9:00–17:30. The capture script navigates there before
  running this.
steps:
  - echo: Rolling the hour past the last open hour; the wheel pulls back to 5:30 PM
  - swipe: { from: { text: Hour }, by: { y: -0.3 }, momentum: false, duration: 900 }
  - wait: 1500
  # 00 and 12 are each wheel's first row, so overshooting the top always rests on
  # them — a swipe of the same length back would land a row either side. The
  # minute goes first: a swipe on the hour straight after its pull back off the
  # dimmed rows was swallowed while that column was still settling.
  - echo: Minute back to 00, then hour back to 12, so the clip loops on 12:00 PM
  - swipe: { from: { text: Minute }, by: { y: 0.45 }, momentum: false, duration: 800 }
  - wait: 1000
  - swipe: { from: { text: Hour }, by: { y: 0.4 }, momentum: false, duration: 800 }
  - wait: 1000
