executionPrerequisite: >-
  The chrome-free preview route is open on planner/scroller and has settled — the current month's
  first week at the top of the list and the title naming that month. The capture script navigates
  there before running this.
steps:
  - echo: Scrolling six weeks down moves the title on to the next month
  - swipe: { from: { id: planner-scroller }, by: { y: -0.3 }, momentum: false, duration: 600 }
  - swipe: { from: { id: planner-scroller }, by: { y: -0.3 }, momentum: false, duration: 600 }
  - wait: 900
  - echo: And back up by the same distance, so the clip loops on the week it began with
  - swipe: { from: { id: planner-scroller }, by: { y: 0.3 }, momentum: false, duration: 600 }
  - swipe: { from: { id: planner-scroller }, by: { y: 0.3 }, momentum: false, duration: 600 }
  - wait: 700
