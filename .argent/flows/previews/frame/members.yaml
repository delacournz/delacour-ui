executionPrerequisite: >-
  The chrome-free preview route is open on frame/members and has settled — a Members frame with three avatar rows.
  The capture script navigates there before running this.
steps:
  - echo: Pressing each row, so the grouped rows' fade feedback shows
  - long-press: { on: { id: member-0 }, duration: 300 }
  - wait: 350
  - long-press: { on: { id: member-1 }, duration: 300 }
  - wait: 350
  - long-press: { on: { id: member-2 }, duration: 300 }
  - wait: 500
