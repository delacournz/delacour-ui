executionPrerequisite: >-
  The chrome-free preview route is open on table/sortable and has settled — four teams sorted by
  points, highest first, with the Points head showing a descending arrow. The capture script
  navigates there before running this.
steps:
  # The testID is on the head's cell, which spans its column; the button inside hugs the label.
  # Tapping the cell's centre misses the button on a wide column, so each tap targets the label
  # within its head.
  - echo: Sorting by team name, then reversing it
  - tap: { text: Team, within: { id: table-sortable-name } }
  - wait: 700
  - tap: { text: Team, within: { id: table-sortable-name } }
  - wait: 700
  - echo: Back to points — ascending, then descending, where the clip began
  - tap: { text: Points, within: { id: table-sortable-points } }
  - wait: 700
  - tap: { text: Points, within: { id: table-sortable-points } }
