executionPrerequisite: >-
  The chrome-free preview route is open on compare/snap-points and has settled — the seam on its 50% stop, the handle
  carrying the testID compare-snap-handle, and the readout below it saying "Settled at 50%". The capture script
  navigates there before running this.
steps:
  - echo: Releasing just short of the trailing edge, so the seam snaps the rest of the way to 100%
  - swipe: { from: { id: compare-snap-handle }, by: { x: 0.4 }, momentum: false, duration: 800 }
  - wait: 700
  - echo: And releasing near the centre, so it snaps back onto 50% and the clip loops
  - swipe: { from: { id: compare-snap-handle }, by: { x: -0.44 }, momentum: false, duration: 800 }
  - wait: 300
