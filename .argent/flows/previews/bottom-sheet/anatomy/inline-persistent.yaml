executionPrerequisite: >-
  The chrome-free preview route is open on bottom-sheet/anatomy/inline-persistent and has settled — the stage with the drawer resting on
  its first detent. The capture script navigates there before running this.
steps:
  - echo: Dragging the drawer up to its second detent
  - swipe: { from: { text: Nearby }, by: { y: -0.3 }, duration: 300, momentum: false }
  - await: { text: { in: { id: inline-readout }, contains: Detent 2 of 2 } }
  - wait: 800
  - echo: Dragging it back down to the first
  - swipe: { from: { text: Nearby }, by: { y: 0.3 }, duration: 300, momentum: false }
  - await: { text: { in: { id: inline-readout }, contains: Detent 1 of 2 } }
  - wait: 600
  - echo: A drag past the first detent does nothing — the drawer is persistent
  - swipe: { from: { text: Nearby }, by: { y: 0.25 }, duration: 300, momentum: false }
  - wait: 700
  - assert: { text: { in: { id: inline-readout }, contains: Detent 1 of 2 } }
  - assert: { visible: { text: Nearby } }
