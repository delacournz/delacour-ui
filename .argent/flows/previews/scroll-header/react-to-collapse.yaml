executionPrerequisite: >-
  The chrome-free preview route is open on scroll-header/react-to-collapse and has settled — the large "Mihi Paewai"
  title, a full-width Follow button under it, and an empty bar. The capture script navigates there before running this.
steps:
  - echo: Scrolling up — the avatar grows into the bar with progress, and the compact Follow arrives once collapsed
  - swipe: { from: { id: scroll-header-profile }, by: { y: -0.3 }, momentum: false, duration: 1400 }
  - wait: 900
  - echo: And back to rest, where both leave again, so the clip loops
  - swipe: { from: { id: scroll-header-profile }, by: { y: 0.35 }, momentum: false, duration: 1400 }
  - wait: 900
