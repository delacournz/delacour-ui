executionPrerequisite: >-
  The chrome-free preview route is open on flow/connect and has settled — Trigger joined to Filter, Notify unjoined,
  the canvas filling the stage between y 0.32 and y 0.68 of the screen. Trigger's out handle sits near x 0.44,
  y 0.492 and Notify's in handle near x 0.558, y 0.554. The capture script navigates there before running this.
steps:
  - echo: Drawing a connection from Trigger's out handle to Notify's in handle, and holding it there
  # A raw gesture-custom rather than a swipe directive: the clip has to hold the finger down over the target and then
  # carry it home, which no directive can express. Releasing on Notify would commit an edge the demo has no way to
  # remove, and the clip could not loop; releasing back on Trigger's own handle connects nothing.
  - tool: gesture-custom
    args:
      interpolate: 10
      events:
        - { type: Down, x: 0.44, y: 0.492 }
        - { type: Move, x: 0.5, y: 0.53, delayMs: 400 }
        - { type: Move, x: 0.558, y: 0.554, delayMs: 400 }
        - { type: Move, x: 0.558, y: 0.555, delayMs: 700 }
        - { type: Move, x: 0.5, y: 0.53, delayMs: 350 }
        - { type: Move, x: 0.44, y: 0.492, delayMs: 350 }
        - { type: Up, x: 0.44, y: 0.492, delayMs: 120 }
