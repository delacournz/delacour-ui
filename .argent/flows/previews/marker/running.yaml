executionPrerequisite: >-
  The chrome-free preview route is open on marker/running and has settled — a finished "Searched 128 files" marker
  above a "Run step" button. The capture script navigates there before running this.
steps:
  - echo: Running the step, so the text shimmers for two whole cycles
  - tap: { id: toggle-running }
  - wait: 3200
  - echo: Finishing it, so the clip ends on the still marker it began with
  - tap: { id: toggle-running }
  - wait: 700
