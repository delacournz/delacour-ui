executionPrerequisite: >-
  The chrome-free preview route is open on sortable/long-press and has settled — four shortcuts, "Scan a document"
  first, its row centred at y 0.366 on the iPhone 17 Pro the capture is pinned to. The capture script navigates there
  before running this.
steps:
  - echo: Holding Scan a document until it lifts, then carrying it down two slots
  # A raw gesture-custom rather than a directive: the lift is a hold followed by a drag in one touch, which no
  # `long-press`/`swipe` directive can express. The points are the row's own centre (sortable-long-press-scan) and
  # two row pitches (0.0895) below it.
  - tool: gesture-custom
    args:
      interpolate: 20
      events:
        - { type: Down, x: 0.5, y: 0.366 }
        - { type: Move, x: 0.5, y: 0.367, delayMs: 450 }
        - { type: Move, x: 0.5, y: 0.545, delayMs: 800 }
        - { type: Up, x: 0.5, y: 0.545, delayMs: 150 }
  - wait: 700
  - echo: And the same hold back up, so the clip loops without a jump cut
  - tool: gesture-custom
    args:
      interpolate: 20
      events:
        - { type: Down, x: 0.5, y: 0.545 }
        - { type: Move, x: 0.5, y: 0.544, delayMs: 450 }
        - { type: Move, x: 0.5, y: 0.366, delayMs: 800 }
        - { type: Up, x: 0.5, y: 0.366, delayMs: 150 }
