executionPrerequisite: >-
  The chrome-free preview route is open on splitter/anatomy and has settled — two
  panes at 50/50, the handle between them carrying the testID handle-0. The
  capture script navigates there before running this.
steps:
  - echo: Dragging the seam toward the trailing edge, so the sidebar grows
  # Anchored on the handle rather than a coordinate, so a layout change moves the
  # gesture with it. momentum:false so the seam stops where the finger does. Each
  # drag is undone by the same distance negated, and the release rounds to step,
  # so the seam lands back on 50 and the clip loops without a jump.
  - swipe: { from: { id: handle-0 }, by: { x: 0.2 }, momentum: false, duration: 600 }
  - wait: 400
  - swipe: { from: { id: handle-0 }, by: { x: -0.2 }, momentum: false, duration: 600 }
  - wait: 400
  - echo: And the other way, so the detail pane grows
  - swipe: { from: { id: handle-0 }, by: { x: -0.2 }, momentum: false, duration: 600 }
  - wait: 400
  - swipe: { from: { id: handle-0 }, by: { x: 0.2 }, momentum: false, duration: 600 }
