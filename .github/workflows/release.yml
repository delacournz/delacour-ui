name: Release

# The stable release, driven by one pull request. Every push to `develop` lands in one of three
# places, decided by `.github/changeset-plan.ts`:
#
# 1. Changesets are pending: `release-pr` opens "🔖 chore(release): version packages" against
#    `develop`, or rebuilds the one already open on top of the new commit. It holds what
#    `changeset version` produces — stable versions, changelogs, the consumed changesets deleted.
# 2. That pull request was just squash-merged: `release` fast-forwards `main` to the merge commit,
#    stages every unpublished package on npm under `latest`, pushes the tags and cuts a GitHub
#    Release per package.
# 3. Neither: nothing to do, and the run exits green.
#
# Merging the release pull request is the only thing a maintainer does by hand, besides approving
# the staged versions. It is also the only way `main` moves, so the repository's front page is
# always the last release and `main` is always an ancestor of `develop`.
#
# Alphas are not this file's job: `alpha.yml` publishes a snapshot on every merge to `develop`.
#
# Publishing is *staged*: `.github/changeset-stage.ts` runs `npm stage publish`
# and a maintainer approves each staged version with 2FA. The trusted publisher
# configured on npmjs.com for this workflow allows staging only, so a direct
# `npm publish` — which is what `changeset publish` runs — is refused with
# `E403 OIDC permission denied for this action`. That is what authenticates the
# job; there is no npm token anywhere, and `bun publish` cannot do either.
#
# Nothing here versions twice. `release-pr` only runs for `develop`'s tip, so a re-run of an old
# run cannot rebuild the pull request from changesets `develop` has since consumed. And a release
# commit that is on `develop` but not on `main` is a release that never finished: any later run
# resumes it — `main` moves, and a version already staged counts as staged.
#
# `workflow_dispatch` is the retry: on `develop` it re-plans from the tip. Re-running a failed
# release run works too.
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  plan:
    name: Plan
    # A dispatch from any other branch would plan against whatever that branch holds.
    if: github.repository_owner == 'delacournz' && github.ref == 'refs/heads/develop'
    runs-on: namespace-profile-linux-small
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}

    steps:
      # The default ref: the commit this run was started for, not `develop`'s tip. A merge that
      # lands right after the release pull request must not turn its run into a no-op. Full
      # history, because the plan compares this commit with `origin/develop` and `origin/main`.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # No install: the script imports nothing outside Bun and Node.
      - name: Decide between the release pull request, a release, and nothing
        id: plan
        run: bun .github/changeset-plan.ts

  release-pr:
    name: Open or update the release pull request
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: namespace-profile-linux-small
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    # Latest wins: the pull request is rebuilt from scratch on each push, so a run for an older
    # commit has nothing to add once a newer one is queued.
    concurrency:
      group: release-pr
      cancel-in-progress: true

    env:
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      # The release app's token, so the push to `changeset-release/develop` is not made with
      # `GITHUB_TOKEN`. A push made with that starts no workflows, so `ci.yml` would never run on
      # the release pull request and its four required checks would never report — unmergeable.
      # No fallback to `GITHUB_TOKEN`: a missing variable or key fails here, by name.
      - name: Mint the release app's token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      # Version half only — no `publish-script`, so this job can never publish. The action resets
      # `changeset-release/develop` to this commit, runs the version script and force-pushes, which
      # is also what keeps the pull request up to date with `develop` for `develop-protected`.
      #
      # v2, not v1: `@changesets/cli` 3 moves the changesets a pre-mode `changeset version`
      # consumes into `.changeset/pre/`, and v1 read that directory as a Changesets-v1 changeset
      # and died on `.changeset/pre/changes.md`.
      #
      # `pr-title` and `commit-message` are `RELEASE_TITLE` in `.github/changeset-plan.ts`, which is how the
      # merge is recognised afterwards. Change one and change the other. The token has to arrive
      # through `github-token`; the action hands it to the version script as `GITHUB_TOKEN`, which
      # `@changesets/changelog-github` needs.
      - name: Version packages into the release pull request
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: bun .github/changeset-version.ts
          pr-title: "🔖 chore(release): version packages"
          commit-message: "🔖 chore(release): version packages"

  release:
    name: Release
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    # The one job that is not on a Namespace runner, and it cannot be: trusted
    # publishing generates a sigstore provenance attestation, and npm verifies
    # it against the runner environment. A self-hosted runner — which is what a
    # Namespace profile is to GitHub — is refused with `E422 Unsupported GitHub
    # Actions runner environment: "self-hosted"`. The alternative was
    # `--provenance=false`, which keeps OIDC but throws away the attestation
    # that is the point of having no npm token.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write

    # Never let two releases interleave; a cancelled publish is worse than a slow one.
    concurrency:
      group: release
      cancel-in-progress: false

    env:
      TURBO_TELEMETRY_DISABLED: 1
      # The commit, not the tag: `changesets/action` builds before it tags, so a tag-derived ref
      # would name something that does not exist yet, and a publish that succeeded before a failed
      # tag push would ship a CLI pointing at a ref that never appears. A SHA is immutable and
      # already resolvable, and raw.githubusercontent.com serves it.
      #
      # Job level so every step sees it, including the CLI's `prepublishOnly` rebuild inside
      # `npm stage publish` — unset there, it would silently bake "main" over the right value.
      DELACOUR_REGISTRY_REF: ${{ github.sha }}

    steps:
      # The release app's token, so the credentials checkout persists are the ones the
      # fast-forward of `main` uses: `main-protected` restricts updates to its bypass list, and the
      # app is on it. `GITHUB_TOKEN` cannot make that push, so there is no fallback to it — a
      # missing variable or key fails here, by name, before anything is built.
      - name: Mint the release app's token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1 and `npm stage` >= 11.15.0; the
      # runner's bundled npm is older than both.
      - name: Update npm for OIDC and staged publishing
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      # The CLI serves components straight out of `registry/` at the commit it
      # was built from, so a stale registry ships an `add` that hands over
      # components which no longer match their source. CI checks this on every
      # pull request; check it again here, because this is the copy that ships.
      - name: Rebuild the registry
        working-directory: packages/cli
        run: bun run registry:build

      - name: Fail if the committed registry is stale
        run: |
          if [ -n "$(git status --porcelain registry/)" ]; then
            echo "registry/ does not match packages/react-native-ui. Run 'bun --filter delacour run registry:build' and commit the result."
            git --no-pager diff --stat registry/
            exit 1
          fi

      # Before `main` moves and before anything is staged, so a broken bundle fails the run with
      # nothing changed, rather than surfacing halfway through `prepublishOnly` with a package
      # already up.
      - name: Build the CLI
        working-directory: packages/cli
        run: bun run build && bun run build:check

      # Before staging, so a `main` that cannot take the release stops the run with npm untouched.
      # Not `--force`, and it must never be. `develop` squash-merges and `main` moves only here, so
      # `main` is always an ancestor of the released commit and this is a fast-forward. If it is
      # not, someone pushed to `main` by hand: the push is refused, and `non_fast_forward` in
      # `main-protected` backs that up — reconcile `main` and re-run. On a re-run after a later
      # failure `main` is already here and the push is a no-op.
      - name: Fast-forward main to the release commit
        run: git push origin "$DELACOUR_REGISTRY_REF:refs/heads/main"

      # Publish half only. The release commit consumed every changeset, so the action finds none
      # and goes straight to `publish-script`, then pushes the tags it wrote and cuts the GitHub
      # Releases. The token has to arrive through `github-token`.
      - name: Stage on npm, tag and cut GitHub Releases
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          # Not `changeset publish`: it would run `npm publish`, which the
          # trusted publisher refuses. The script stages every unpublished
          # package, writes the stage ids to the step summary, then runs
          # `changeset git-tag` so the action still pushes tags and opens the
          # GitHub Releases. Nothing reaches a dist-tag until someone runs
          # `npm stage approve <id>`.
          publish-script: bun .github/changeset-stage.ts
