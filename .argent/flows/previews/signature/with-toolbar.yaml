  # A raw gesture-custom rather than a directive: a signature is a curved path,
  # which no `tap`/`swipe` directive can draw. The points are a looped name and an
  # underline in the pad's own fractions, mapped onto the pad's rect as the preview
  # route lays it out on an iPhone 17 Pro (402x874) — regenerate if the demo moves.
