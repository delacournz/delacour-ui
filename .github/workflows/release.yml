name: Release

# Two behaviours, chosen by the event:
#
# - push to `develop`: pending changesets open (or refresh) the Version Packages PR against
#   `develop`. Publishing is never reached from a push — `publish-script` is unset for it — so
#   merging that PR does not release anything by itself.
# - workflow_dispatch on `develop`: the release. Stage every unpublished package on npm, push the
#   tags, open the GitHub Releases, then fast-forward `main` to the commit that was released. That
#   last step is the only way `main` moves, so the repository's front page is always the last
#   release and `main` is always an ancestor of `develop`.
#
# Publishing is *staged*: `.github/changeset-stage.ts` runs `npm stage publish`
# and a maintainer approves each staged version with 2FA. The trusted publisher
# configured on npmjs.com for this workflow allows staging only, so a direct
# `npm publish` — which is what `changeset publish` runs — is refused with
# `E403 OIDC permission denied for this action`. That is what authenticates the
# job; there is no npm token anywhere, and `bun publish` cannot do either.
#
# The trusted publisher binds to this file's name, not to a branch, so moving the trigger from
# `main` to `develop` needs no change on npmjs.com.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Never let two releases interleave; a cancelled publish is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Version PR or Publish
    # A dispatch from any other branch would publish whatever that branch holds and then fail to
    # fast-forward `main` to it — with the packages already staged.
    if: github.repository_owner == 'delacournz' && github.ref == 'refs/heads/develop'
    # The one job that is not on a Namespace runner, and it cannot be: trusted
    # publishing generates a sigstore provenance attestation, and npm verifies
    # it against the runner environment. A self-hosted runner — which is what a
    # Namespace profile is to GitHub — is refused with `E422 Unsupported GitHub
    # Actions runner environment: "self-hosted"`. The alternative was
    # `--provenance=false`, which keeps OIDC but throws away the attestation
    # that is the point of having no npm token.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    env:
      TURBO_TELEMETRY_DISABLED: 1
      # Job level, not step level. `npm publish` re-runs the CLI's
      # `prepublishOnly`, which rebuilds the bundle — if the ref were unset for
      # that rebuild it would silently bake "main" over the correct value.
      #
      # The commit, not the tag: `changesets/action` builds before it tags, so a
      # tag-derived ref would name something that does not exist yet, and a
      # publish that succeeded before a failed tag push would ship a CLI
      # pointing at a ref that never appears. A SHA is immutable and already
      # resolvable, and raw.githubusercontent.com serves it.
      DELACOUR_REGISTRY_REF: ${{ github.sha }}

    steps:
      # The PAT, so the credentials checkout persists are the ones the final `git push` to `main`
      # uses. `main-protected` restricts updates to repository admins; `GITHUB_TOKEN` is not one,
      # and a push with it is refused. `RELEASE_TOKEN` must therefore belong to an admin.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # A dispatch with changesets still pending would make `changesets/action` open a Version
      # Packages PR instead of publishing, and the run would then fast-forward `main` to a commit
      # whose versions were never bumped. Merge the Version Packages PR first.
      - name: Fail a release with changesets still pending
        if: github.event_name == 'workflow_dispatch'
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "::error::Changesets are still pending. Merge the Version Packages PR into develop, then run Release again."
            echo "$pending"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1 and `npm stage` >= 11.15.0; the
      # runner's bundled npm is older than both.
      - name: Update npm for OIDC and staged publishing
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      # The CLI serves components straight out of `registry/` at the commit it
      # was built from, so a stale registry ships an `add` that hands over
      # components which no longer match their source. CI checks this on every
      # pull request; check it again here, because this is the copy that ships.
      - name: Rebuild the registry
        working-directory: packages/cli
        run: bun run registry:build

      - name: Fail if the committed registry is stale
        run: |
          if [ -n "$(git status --porcelain registry/)" ]; then
            echo "registry/ does not match packages/react-native-ui. Run 'bun --filter delacour run registry:build' and commit the result."
            git --no-pager diff --stat registry/
            exit 1
          fi

      # Build before the action so a broken bundle fails the run outright, rather
      # than surfacing halfway through `prepublishOnly` with a package already up.
      - name: Build the CLI
        working-directory: packages/cli
        run: bun run build && bun run build:check

      # v2, not v1: `@changesets/cli` 3 moves the changesets a pre-mode
      # `changeset version` consumes into `.changeset/pre/` instead of listing
      # them in `pre.json`, and v1 read that directory as a Changesets-v1
      # changeset and died on `.changeset/pre/changes.md` — which is how the
      # first Version Packages merge published nothing. v2 knows the layout.
      #
      # v2 also pushes through the GitHub API, so the version commit is signed
      # and the token has to arrive through `github-token`; the `GITHUB_TOKEN`
      # environment variable is ignored.
      - name: Create Version PR or publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          # A PAT, not GITHUB_TOKEN: events raised by GITHUB_TOKEN do not start
          # workflow runs, so a Version Packages PR opened with it would never
          # run the four checks `develop-protected` requires and could never be
          # merged. The fallback is for the publish half only — tags and GitHub
          # Releases need nothing more than GITHUB_TOKEN — so a missing PAT
          # cannot stop a release that is already versioned. The input is
          # required, and an unset secret is an empty string, which the action
          # rejects before it reads `.changeset/` at all.
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "🔖 chore(release): version packages"
          pr-title: "🔖 chore(release): version packages"
          version-script: bun .github/changeset-version.ts
          # Not `changeset publish`: it would run `npm publish`, which the
          # trusted publisher refuses. The script stages every unpublished
          # package, writes the stage ids to the step summary, then runs
          # `changeset git-tag` so the action still pushes tags and opens the
          # GitHub Releases. Nothing reaches a dist-tag until someone runs
          # `npm stage approve <id>`.
          #
          # Only on dispatch. On a push to `develop` with nothing pending — the merge of the Version
          # Packages PR, say — an empty value leaves the action with nothing to do.
          publish-script: ${{ github.event_name == 'workflow_dispatch' && 'bun .github/changeset-stage.ts' || '' }}

      # Not `--force`, and it must never be. `develop` squash-merges and `main` moves only here, so
      # `main` is always an ancestor of the released commit and this is a fast-forward. If it is
      # not, someone pushed to `main` by hand: the push is refused, `non_fast_forward` in
      # `main-protected` backs that up, and the packages are already staged — reconcile `main` and
      # re-run, which the stage script treats as success for anything already staged.
      - name: Fast-forward main to the released commit
        if: github.event_name == 'workflow_dispatch'
        run: git push origin "${GITHUB_SHA}:refs/heads/main"
