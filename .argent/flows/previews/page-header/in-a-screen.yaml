executionPrerequisite: >-
  The chrome-free preview route is open on page-header/in-a-screen in a device frame and has settled — the whole screen,
  an overlay navbar with a back button, the cover running under it, scrolled to the top, and "Join" in the primary fill.
  The capture script navigates there before running this.
steps:
  - echo: Join — the button steps down to "Joined" and Members ticks over
  - tap: { id: page-header-screen-join }
  - wait: 700
  - echo: Scroll the header away under the navbar
  - swipe: { from: { id: page-header-screen-scroll }, by: { y: -0.3 }, momentum: false }
  - wait: 700
  - echo: Back to the top
  - swipe: { from: { id: page-header-screen-scroll }, by: { y: 0.4 }, momentum: false }
  - wait: 700
  - echo: And leave, so the clip loops without a jump cut
  - tap: { id: page-header-screen-join }
  - wait: 600
