executionPrerequisite: >-
  The chrome-free preview route is open on marquee/hold-to-pause and has settled —
  one strip of large badges already travelling. The capture script navigates there before running this.
steps:
  - echo: Let the strip run, so the clip opens on the motion
  - wait: 1200
  - echo: Hold a finger mid-strip — it eases to a stop and stays put while held
  - long-press: { on: { id: marquee-hold-to-pause }, duration: 1800 }
  - echo: Released, it eases back up to speed from exactly where it stopped
  - wait: 1500
