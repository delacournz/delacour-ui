executionPrerequisite: >-
  The chrome-free preview route is open on map/places and has settled — markers over Wellington with their tiles
  loaded, the Museum selected (primary pin and label). The capture script navigates there before running this.
  Each marker is tapped by its `-content` id — the marker's own view, which the runner tree can see.
steps:
  - echo: Selecting each place in turn
  - tap: { id: map-places-gardens-content }
  - wait: 800
  - tap: { id: map-places-market-content }
  - wait: 800
  - echo: And the Museum again, so the clip loops without a jump cut
  - tap: { id: map-places-museum-content }
  - wait: 600
