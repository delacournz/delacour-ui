executionPrerequisite: >-
  The chrome-free preview route is open on signature/alternative and has settled — an empty pad with
  "Can't sign? Type your name" in its toolbar. The capture script navigates there before running this.
steps:
  - echo: Taking the typed-name route
  - tap: { id: signature-alternative }
  - await: { visible: { id: signature-typed-name } }
  - wait: 1200
  - echo: And back to the pad, so the clip loops
  - tap: { id: signature-draw-instead }
  - await: { visible: { id: signature-alternative-pad } }
  - wait: 600
