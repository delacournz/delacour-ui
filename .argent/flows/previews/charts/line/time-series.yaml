executionPrerequisite: >-
  The chrome-free preview route is open on charts/line/time-series and has settled — thirty days of one series under an area, no cursor,
  the plot's vertical centre at y 0.5 of the screen. The capture script navigates
  there before running this.
steps:
  - echo: Holding to arm the scrub, which does not activate on a plain drag
  # A raw gesture-custom rather than a directive: the scrub is a partial drag
  # behind a long press, which no `tap`/`swipe` directive can express. The x
  # values walk across the plot, right of the y-axis labels.
  - tool: gesture-custom
    args:
      interpolate: 6
      events:
        - { type: Down, x: 0.22, y: 0.5 }
        - { type: Move, x: 0.23, y: 0.5, delayMs: 500 }
        - { type: Move, x: 0.45, y: 0.5, delayMs: 260 }
        - { type: Move, x: 0.68, y: 0.5, delayMs: 260 }
        - { type: Move, x: 0.88, y: 0.5, delayMs: 260 }
  - echo: And back, so the clip loops without the cursor jumping across
  - tool: gesture-custom
    args:
      interpolate: 6
      events:
        - { type: Move, x: 0.55, y: 0.5, delayMs: 260 }
        - { type: Move, x: 0.23, y: 0.5, delayMs: 260 }
        - { type: Up, x: 0.22, y: 0.5, delayMs: 160 }
