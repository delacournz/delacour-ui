[install]
# Metro resolves modules by walking node_modules directories and cannot see
# through Bun's default isolated layout (packages hidden under node_modules/.bun).
# A hoisted, flat node_modules is what React Native tooling expects; without
# this, Metro fails to resolve @expo/metro-runtime and the bundle never builds.
linker = "hoisted"

# `@delacournz/*` (delacour-monorepo's shared packages — the OpenTelemetry family and the
# `@delacournz/ui` / `@delacournz/apogee` design systems) is published to GitHub Packages, not npm. Installing it
# needs a CLASSIC personal access token with `read:packages` in NPM_TOKEN — GitHub's npm registry rejects fine-grained tokens. Every install of the workspace
# needs it, not only `apps/web`'s, because the lockfile is shared: on Railway it is a preserved
# variable on `ui-web`, in CI the `NPM_TOKEN` Actions secret, on EAS a secret env var in all three
# environments; locally, export it in your shell. The token belongs to a machine user, not a
# person. Unset, the install fails with a 401 from npm.pkg.github.com.
[install.scopes]
"@delacournz" = { url = "https://npm.pkg.github.com", token = "$NPM_TOKEN" }
