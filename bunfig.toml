[install]
# Metro resolves modules by walking node_modules directories and cannot see
# through Bun's default isolated layout (packages hidden under node_modules/.bun).
# A hoisted, flat node_modules is what React Native tooling expects; without
# this, Metro fails to resolve @expo/metro-runtime and the bundle never builds.
linker = "hoisted"

# `@delacournz/*` (the OpenTelemetry packages from delacour-monorepo) is published to GitHub
# Packages, not npm. Installing it needs a CLASSIC personal access token with `read:packages` in
# NPM_TOKEN — GitHub's npm registry rejects fine-grained tokens. On Railway it is a preserved
# variable on `ui-web`; locally, export it in your shell. With nothing from the scope in
# package.json, no request is made and an unset NPM_TOKEN is harmless.
[install.scopes]
"@delacournz" = { url = "https://npm.pkg.github.com", token = "$NPM_TOKEN" }
