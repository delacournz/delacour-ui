executionPrerequisite: >-
  The chrome-free preview route is open on frame/decision-footer and has settled — an inset Close project frame,
  Archive files on, Notify members off, the description reading "Choose what happens to its work." The capture
  script navigates there before running this.
steps:
  - echo: Changing both settings, then saving
  - tap: { id: switch-archive }
  - wait: 400
  - tap: { id: switch-notify }
  - wait: 500
  - tap: { id: frame-save }
  - wait: 900
  - echo: Putting both back and cancelling, so the clip loops without a jump cut
  - tap: { id: switch-notify }
  - wait: 400
  - tap: { id: switch-archive }
  - wait: 500
  - tap: { id: frame-cancel }
  - wait: 400
