executionPrerequisite: >-
  The chrome-free preview route is open on qr-code/with-logo and has settled — a rounded code with a star on a plate
  in the middle, and its Logo switch on. The capture script navigates there before running this.
steps:
  - echo: Taking the logo off — the code re-encodes at the requested level, sparser
  - wait: 600
  - tap: { id: qr-code-logo-switch }
  - wait: 1300
  - echo: And on again, so the clip loops without a jump cut
  - tap: { id: qr-code-logo-switch }
  - wait: 900
