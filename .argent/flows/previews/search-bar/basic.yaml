executionPrerequisite: >-
  The chrome-free preview route is open on search-bar/basic and has settled — one search bar holding "Wellington",
  not focused, no Cancel. The capture script navigates there before running this.
steps:
  - echo: Focusing the field, so Cancel slides in
  - tap: { id: search }
  - wait: 700
  - echo: Clearing keeps the keyboard and focus
  - tap: { id: search-clear }
  - wait: 500
  - echo: Typing the query back, so the clear button returns
  - tool: keyboard
    args: { text: Wellington, delayMs: 90 }
  - wait: 500
  - echo: Submitting blurs the field and Cancel slides out, so the clip loops as it began
  - tool: keyboard
    args: { key: enter }
  - wait: 700
