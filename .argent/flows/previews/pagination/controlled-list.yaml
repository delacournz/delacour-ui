executionPrerequisite: >-
  The chrome-free preview route is open on pagination/controlled-list and has settled — Order #10001 to #10005 above a
  small numbers run on page 1 of 94. The capture script navigates there before running this.
steps:
  - echo: Two pages on — the rows re-slice under each press
  - tap: { text: Next page, within: { id: pagination-list } }
  - wait: 500
  - tap: { text: Next page, within: { id: pagination-list } }
  - wait: 700
  - echo: And two back, so the clip loops on the first five orders
  - tap: { text: Previous page, within: { id: pagination-list } }
  - wait: 500
  - tap: { text: Previous page, within: { id: pagination-list } }
