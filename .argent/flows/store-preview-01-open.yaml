executionPrerequisite: >-
  The app has just been launched and is on its home screen. goldie restarts it
  before the first segment and starts recording afterwards, so a `launch:` here
  would restart it a second time, on camera.
steps:
  - await: { visible: { id: theme-trigger } }
  - wait: 1000
  - echo: Open the customizer from the floating trigger
  - tap: { id: theme-trigger }
  - await: { visible: { id: theme-base-color-zinc } }
  - wait: 900
  - tap: { id: theme-base-color-zinc }
  - wait: 500
  - tap: { id: theme-accent-amber }
  - wait: 1200
