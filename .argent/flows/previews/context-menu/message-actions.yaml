executionPrerequisite: >-
  The chrome-free preview route is open on context-menu/message-actions and has settled — the message bubble with
  "Hold the message" under it and the menu closed. The capture script navigates there before running this.
steps:
  - echo: Holding the message past its 350ms delay, so the menu opens at the finger
  - long-press: { on: { id: context-menu-message }, duration: 600 }
  - await: { visible: { id: context-menu-reply } }
  - wait: 1400
  - echo: Dismissing it from the scrim, so nothing is chosen and the clip loops
  # A coordinate rather than the scrim's label: the scrim fills the screen, so a
  # tap on its centre lands on the panel and chooses a row. Near the top the
  # scrim is the only thing there, and the await below fails the flow if not.
  - tool: gesture-tap
    args: { x: 0.5, y: 0.12 }
  - await: { hidden: { id: context-menu-reply } }
