executionPrerequisite: >-
  The chrome-free preview route is open on compare/vertical and has settled — Morning above Night, the seam halfway
  down on the handle carrying the testID compare-vertical-handle. The capture script navigates there before running
  this.
steps:
  - echo: Raising the seam toward Morning, then dropping it toward Night
  - swipe: { from: { id: compare-vertical-handle }, by: { y: -0.1 }, momentum: false, duration: 600 }
  - wait: 400
  - swipe: { from: { id: compare-vertical-handle }, by: { y: 0.2 }, momentum: false, duration: 900 }
  - wait: 400
  - echo: And back to halfway, so the clip loops without a jump cut
  - swipe: { from: { id: compare-vertical-handle }, by: { y: -0.1 }, momentum: false, duration: 600 }
