name: CI

# The merge gate for every pull request. Each non-draft pull request from a branch in this repository
# runs the signoff checks here and, when they all pass, the `signoff` job writes the `signoff/*`
# commit statuses `.github/rulesets/develop.json` requires — the same ones `bun run signoff` writes
# from a laptop (see AGENTS.md § Signoff). The repository is public, so GitHub-hosted runners cost
# nothing, and the checks run on every push rather than only when someone remembers to sign off.
#
# When it runs:
#
# - `pull_request` — `opened`, `synchronize` (every push), `reopened` and `ready_for_review`. A
#   draft runs nothing; marking it ready for review starts the run. A fork's pull request runs
#   nothing either: its token can neither read `@delacournz/*` nor write a status, so a maintainer
#   dispatches it (below) after reading the diff. `verify-expo` (installs from npm, minutes) runs
#   only on the version pull request (`changeset-release/develop`), before a release reaches npm.
# - `workflow_dispatch`, the escape hatch. The `mode` dropdown picks `report` (run only) or
#   `signoff` (a green run writes the statuses itself). `pr` and `signoff-sha` are both optional and
#   pick the commit: a PR number tests that PR's head, a SHA tests that commit, both pins the PR to
#   that exact head, neither tests the tip of the dispatched ref. The `resolve` job turns that into
#   one SHA, and every job checks that SHA out — the workflow file is always the dispatched ref's,
#   the tree tested is the target's.
# - A push to `release/playground/*`, which triggers the EAS `release:prod` workflow that ships the
#   app to the stores. GitHub and EAS run independently, so these checks cannot hold that release
#   back — they only mean a push that shipped something broken is visibly red rather than silently
#   green. Railway does not deploy from these branches.
#
# Not on push to `develop`. Every commit there is the squash of a pull request signed off at its
# head; the next pull request's run covers whatever the squash changed.

on:
  push:
    branches: [release/playground/*]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: "report = run the checks only; signoff = a green run writes the signoff statuses"
        required: true
        type: choice
        options: [report, signoff]
        default: report
      pr:
        description: "Pull request number to test (blank = not a PR)"
        required: false
        type: string
      signoff-sha:
        description: "Commit SHA to test (blank = the PR's head, or the dispatched ref's tip)"
        required: false
        type: string

# No `paths:` filter: every check runs on every pull request, and the path gates of a local signoff
# (scripts/signoff-checks.ts) do not apply here. Only `resolve` carries the draft and fork gate;
# every other job needs it, so a skipped `resolve` skips the run.
#
# Runners are GitHub-hosted (`ubuntu-latest`), free on a public repository. Checkout and caches are
# GitHub's own actions: Bun's install cache is keyed on `bun.lock`, and each job that runs turbo
# keeps its local cache (`.turbo/cache`) keyed per commit and restored from the newest entry, so a
# second push to a pull request replays every task whose inputs did not change.
# `.github/workflows.test.ts` fails if a Namespace runner or action comes back.

# `packages: read` lets each job's Install step read `@delacournz/*` from GitHub Packages with the
# job's own token, set as NPM_TOKEN on that step only. Fork pull requests run none of these jobs (the
# `if:` gate on `resolve`, which also refuses a fork's PR on dispatch), so no fork token ever installs.
# `statuses: write` is the `signoff` job's alone, granted there.
permissions:
  contents: read
  packages: read

concurrency:
  # The target is in the key so two dispatches from the same ref for different PRs or SHAs do not
  # evict each other's pending run. Both inputs are empty outside a dispatch.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.pr }}-${{ inputs.signoff-sha }}
  # Pull requests only. A cancelled push run reports `cancelled`, which is not success, and a
  # red run on `develop` or a release branch should mean the tree is broken, not superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Picks the one commit every job below checks out and the `signoff` job writes statuses for, and
  # whether it writes them at all. Resolved once, up front: resolving again at signoff time would
  # sign whatever a PR's head had moved to while the checks ran.
  resolve:
    name: resolve
    # Pull requests: not a draft, and from a branch in this repository.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sign: ${{ steps.resolve.outputs.sign }}
      # Whether `verify-expo` runs: everywhere but an ordinary pull request.
      expo: ${{ steps.resolve.outputs.expo }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref }}
          MODE: ${{ inputs.mode }}
          PR: ${{ inputs.pr }}
          INPUT_SHA: ${{ inputs.signoff-sha }}
        # Inputs reach the script through env, never `${{ }}` inside it, so a crafted value cannot
        # become shell.
        run: |
          set -euo pipefail
          if [ "$EVENT" != "workflow_dispatch" ]; then
            SIGN=false
            EXPO=true
            if [ "$EVENT" = "pull_request" ]; then
              SIGN=true
              [ "$HEAD_REF" = "changeset-release/develop" ] || EXPO=false
            fi
            echo "sha=${EVENT_SHA}" >> "$GITHUB_OUTPUT"
            echo "sign=${SIGN}" >> "$GITHUB_OUTPUT"
            echo "expo=${EXPO}" >> "$GITHUB_OUTPUT"
            echo "→ ${EVENT}: ${EVENT_SHA} (sign: ${SIGN}, verify-expo: ${EXPO})"
            exit 0
          fi

          PR="${PR#\#}"
          SHA="$EVENT_SHA"
          if [ -n "$INPUT_SHA" ]; then
            # Expands a short SHA and proves the commit exists in this repository.
            SHA=$(gh api "repos/${REPO}/commits/${INPUT_SHA}" --jq .sha) \
              || { echo "::error::signoff-sha ${INPUT_SHA} is not a commit in ${REPO}"; exit 1; }
          fi

          if [ -n "$PR" ]; then
            [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number, got '${PR}'"; exit 1; }
            IFS=$'\t' read -r STATE HEAD_REPO HEAD_SHA < <(gh api "repos/${REPO}/pulls/${PR}" \
              --jq '[.state, (.head.repo.full_name // ""), .head.sha] | @tsv') \
              || { echo "::error::#${PR} is not a pull request in ${REPO}"; exit 1; }
            [ "$STATE" = "open" ] || { echo "::error::#${PR} is ${STATE}, not open"; exit 1; }
            # A fork's head is untrusted code; this run carries a package-reading and a status-writing token.
            [ "$HEAD_REPO" = "$REPO" ] || { echo "::error::#${PR} is from ${HEAD_REPO:-a deleted fork}; fork pull requests are not run here"; exit 1; }
            if [ -n "$INPUT_SHA" ] && [ "$SHA" != "$HEAD_SHA" ]; then
              echo "::error::#${PR}'s head is ${HEAD_SHA}, not ${SHA}; it moved, or the SHA is from another branch"
              exit 1
            fi
            SHA="$HEAD_SHA"
          fi

          SIGN=false
          [ "$MODE" = "signoff" ] && SIGN=true
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "sign=${SIGN}" >> "$GITHUB_OUTPUT"
          echo "expo=true" >> "$GITHUB_OUTPUT"
          {
            echo "### ${MODE}: \`${SHA}\`"
            [ -n "$PR" ] && echo "Pull request #${PR}"
            [ "$SIGN" = "true" ] && echo "A green run writes the signoff statuses for this commit." || echo "Report only — no statuses are written."
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: typecheck
    needs: resolve
    runs-on: ubuntu-latest
    # No job here has ever taken more than a minute. The default is 360: a wedged runner would hold
    # a pull request's gate for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Matches `packageManager` in package.json — Railpack reads the same field to pick Bun.
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install
        # `@delacournz/*` comes from GitHub Packages (see `bunfig.toml`) with this job's own token,
        # read-only under `packages: read`. Step level: nothing after the install sees it.
        env:
          NPM_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile
      # `@delacour/web#typecheck` depends on `@delacour/web#codegen` (see turbo.jsonc): TanStack
      # Router generates the gitignored `apps/web/src/routeTree.gen.ts` during that build, and tsc
      # cannot run without it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ needs.resolve.outputs.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - run: bun run typecheck

  check:
    name: check (lint + format)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install
        env:
          NPM_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ needs.resolve.outputs.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - run: bun run check

  test:
    name: test
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install
        env:
          NPM_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ needs.resolve.outputs.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - run: bun run test

  build:
    name: build
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install
        env:
          NPM_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile
      # Scoped to the docs site on purpose. This is the only thing Railway deploys, and an
      # unfiltered `turbo build` would drag in the Expo playground for no benefit.
      #
      # This repeats the vite build the typecheck job already triggers. That is fifteen seconds,
      # and it buys an independent proof that the docs site builds on its own — which is the exact
      # command Railway runs.
      #
      # Never add `bun run previews` here. It drives an iOS simulator and needs a Mac with Xcode;
      # its outputs (apps/web/public/previews/**, apps/web/src/previews/manifest.ts) are committed
      # precisely so this builds on a simulator-less runner. See apps/web/AGENTS.md.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ needs.resolve.outputs.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - run: bun run build --filter=@delacour/web

  registry:
    name: registry
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # tsdown's bin runs under Node, and it picks its config loader from that Node: one with
      # native TypeScript (>= 22.18) loads tsdown.config.ts itself, an older one falls back to
      # the optional `unrun` package, which is not installed. Pin one rather than depend on the
      # runner image's.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install
        env:
          NPM_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      # The registry is committed, so a component change that does not rebuild
      # it would publish a registry describing the previous version. It holds no
      # source — an item names `packages/react-native-ui/src/...` at the same ref — so
      # what drifts here is the metadata: a new file, a changed import, a
      # dependency that moved between `expo install` and the package manager.
      - name: Check the registry is current
        working-directory: packages/cli
        run: bun run registry:build

      - run: git diff --exit-code registry/

      # The docs site derives its per-component install block from the registry,
      # into a committed module. A stale one puts wrong dependencies and dead
      # file links on every component page, silently.
      - name: Check the docs install manifest is current
        working-directory: apps/web
        run: bun run gen-install

      - run: git diff --exit-code apps/web/src/registry/install.ts

      # The agent skill's component list is derived from the same registry. The
      # skill itself names no component on purpose, so this is only what
      # `delacour skills --list` prints — but a stale list is a stale list.
      - name: Check the skill's component list is current
        working-directory: packages/skills
        run: bun run gen-skill

      - run: git diff --exit-code packages/skills/src/components.generated.ts

      # Offline and fast: scaffolds an app, runs the CLI, and checks the shape
      # of what came out. The full run installs from npm and lives in its own job.
      # Both layouts: components in the app, and components in a shared package
      # several apps could use. The second has wiring the first does not — a
      # workspace link, an exports map, Metro's resolver — and none of it is
      # exercised by the first.
      - name: Verify both layouts (structure only)
        working-directory: packages/cli
        run: |
          bun run verify:expo --no-install
          bun run verify:expo --no-install --layout monorepo

  verify-expo:
    name: CLI against a real Expo app (${{ matrix.layout }})
    needs: resolve
    if: needs.resolve.outputs.expo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        layout: [standalone, monorepo]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # tsdown's bin runs under Node, and it picks its config loader from that Node: one with
      # native TypeScript (>= 22.18) loads tsdown.config.ts itself, an older one falls back to
      # the optional `unrun` package, which is not installed. Pin one rather than depend on the
      # runner image's.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install
        env:
          NPM_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      # Scaffolds an Expo app, installs Uniwind and Tailwind, runs init and adds
      # every item, then typechecks the result. A clean tsc is the proof that
      # every copied component resolves every import it makes — which no fixture
      # test can establish, because a fixture has no dependency tree.
      # --bundle also runs the components through Metro, which is the only stage
      # that exercises Uniwind's transform. A class the scanner never saw is
      # dropped from the build silently, and tsc cannot see that at all.
      - name: Scaffold, install, typecheck and bundle
        working-directory: packages/cli
        run: bun run verify:expo --bundle --layout ${{ matrix.layout }}

  # Every component's suites copied into a real app on each runner a consumer may use, and run by
  # it — the `tests` signoff check. The conversion is two string substitutions held up by a build
  # guard; this is what proves the guard knew everything Jest and Vitest refuse.
  copied-tests:
    name: copied tests (${{ matrix.runner }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        runner: [bun, jest, vitest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install
        env:
          NPM_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile
      - name: Copy every suite and run it
        working-directory: packages/cli
        run: bun run verify:expo --tests ${{ matrix.runner }}

  # Writes what `bun run signoff` would have, for the commit these jobs tested: every sub-context,
  # then the umbrella last. `needs` covers every job above, so the umbrella is earned only when all of
  # them passed — `verify-expo` included wherever it ran, and skipped only on an ordinary pull request.
  signoff:
    name: signoff
    needs: [resolve, typecheck, check, test, build, registry, verify-expo, copied-tests]
    # `sign` is true for every pull request `resolve` let through and a dispatch with mode `signoff`.
    # `always()` so a skipped `verify-expo` does not skip this job; every other result is checked.
    if: >-
      always() && needs.resolve.result == 'success' && needs.resolve.outputs.sign == 'true' &&
      needs.typecheck.result == 'success' && needs.check.result == 'success' &&
      needs.test.result == 'success' && needs.build.result == 'success' &&
      needs.registry.result == 'success' && needs.copied-tests.result == 'success' &&
      (needs.verify-expo.result == 'success' ||
      (needs.verify-expo.result == 'skipped' && needs.resolve.outputs.expo != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The default token is read-only on statuses. Nothing here checks out or installs.
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        # REQUIRED_CONTEXTS in scripts/signoff-checks.ts (which signoff.test.ts pins against
        # `.github/rulesets/develop.json`), plus the two path-gated ones, which ran here too. The
        # umbrella is last.
        run: |
          BY="passed in CI, triggered by ${ACTOR}${PR:+ for #${PR}}"
          for CONTEXT in signoff/typecheck signoff/check signoff/test signoff/build signoff/registry signoff/tests signoff; do
            gh api "repos/${{ github.repository }}/statuses/${SHA}" --method POST \
              -f state=success \
              -f "context=${CONTEXT}" \
              -f "description=${BY}" \
              -f "target_url=${RUN_URL}"
            echo "✓ ${CONTEXT} written for ${SHA}"
          done
